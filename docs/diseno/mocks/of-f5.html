<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OF · Mock F5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: mismos que .dx-otb (Bandeja de OTs) ===== */
.dx-of{--n:#1A2B4A;--cy:#00ACC1;--cyf:#0B4F5A;--cyb:#E0F7FA;--vi:#5B3A8C;--vib:#F0EAFB;--amf:#8A4B00;--amb:#FFF3E0;--amd:#E08A00;--grf:#14633A;--grb:#E3F6EA;--blf:#1E4E8C;--blb:#E6EFFB;--rdf:#9B1C1C;--rdb:#FDECEC;--rd:#DC2626;--gr:#6B7280;--grb2:#F1F3F5;--grf2:#4B5563;--ink:#1F2937;--line:#E4E7EB;--line2:#EEF0F3;--bd:#C9CFD8;--bg:#F4F6F8;--hd:#F8F9FA;--card:#fff;--hov:#F6FBFC;
  container-type:inline-size;background:var(--bg);color:var(--ink);font:14px/1.4 'DM Sans',sans-serif;min-height:100vh}
[data-theme='dark'] .dx-of{--n:#F8FAFC;--cy:#22D3EE;--cyf:#67E8F9;--cyb:#0A3038;--vi:#D8B4FE;--vib:#321B3B;--amf:#FDBA74;--amb:#3A2810;--amd:#F59E0B;--grf:#86EFAC;--grb:#12351F;--blf:#93C5FD;--blb:#13294B;--rdf:#FCA5A5;--rdb:#3B1414;--rd:#F87171;--gr:#94A3B8;--grb2:#273244;--grf2:#CBD5E1;--ink:#F8FAFC;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.08);--bd:#475569;--bg:#020617;--hd:#0F172A;--card:#0F172A;--hov:#172033}
*{box-sizing:border-box}body{margin:0;background:#F4F6F8}[data-theme='dark'] body{background:#020617}
button,input,select{font:inherit}button{cursor:pointer}
/* Barra del mock (no es parte del diseño) */
.mockbar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:#111827;color:#fff;font:13px 'DM Sans'}
.mockbar button{height:32px;padding:0 12px;border:1px solid #374151;border-radius:8px;background:#1F2937;color:#fff}
.mockbar button.on{background:#00ACC1;border-color:#00ACC1;color:#02161A;font-weight:700}
.mockbar span{opacity:.7;margin-left:auto}
/* ===== Layout común ===== */
.dx-of-in{padding:24px 28px 48px;max-width:1280px}
.dx-of-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.dx-of-eyebrow{color:var(--cyf);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.dx-of-title{margin:4px 0;color:var(--n);font:700 28px/1.2 Sora,sans-serif}
.dx-of-sub{margin:0;color:var(--gr)}
.dx-of-primary{display:inline-flex;height:44px;align-items:center;gap:8px;padding:0 18px;border:0;border-radius:10px;background:#1A2B4A;color:#fff;font-weight:700;white-space:nowrap}
[data-theme='dark'] .dx-of-primary{background:#00ACC1;color:#02161A}
.dx-of-primary:disabled{opacity:.45;cursor:not-allowed}
.dx-of-ghost{display:inline-flex;height:44px;align-items:center;gap:8px;padding:0 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font-weight:600;white-space:nowrap}
.dx-of-link{border:0;background:none;padding:0;color:var(--cyf);font-weight:700}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* KPI (familia de la Bandeja de OTs) */
.dx-of-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.dx-of-kpi{display:flex;min-width:0;flex-direction:column;gap:2px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 1px 2px #0f1b300a;color:inherit;text-align:left}
.dx-of-kpi:hover{background:var(--hov)}.dx-of-kpi.is-on{border-color:var(--n);box-shadow:inset 0 0 0 1px var(--n)}
.dx-of-kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--gr);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dx-of-ico{display:flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:9px}
.dx-of-ico.is-cyan{background:var(--cyb);color:var(--cyf)}.dx-of-ico.is-gray{background:var(--grb2);color:var(--grf2)}.dx-of-ico.is-red{background:var(--rdb);color:var(--rdf)}.dx-of-ico.is-amber{background:var(--amb);color:var(--amf)}
.dx-of-kpi-val{margin-top:6px;color:var(--n);font:700 26px/1.1 Sora,sans-serif}
.dx-of-kpi-note{overflow:hidden;color:var(--gr);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.dx-of-kpi.is-danger{border-color:color-mix(in srgb,var(--rd) 40%,var(--line))}.dx-of-kpi.is-danger .dx-of-kpi-val{color:var(--rdf)}
.dx-of-kpi.is-alert{border-color:color-mix(in srgb,var(--amd) 45%,var(--line))}.dx-of-kpi.is-alert .dx-of-kpi-val{color:var(--amf)}
/* Tarjeta y barra */
.dx-of-card{overflow:visible;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 1px 2px #0f1b300a}
.dx-of-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.dx-of-bar h2{margin:0 auto 0 0;color:var(--n);font:700 16px/1.4 Sora,sans-serif}
.dx-of-count{margin-left:8px;color:var(--gr);font:500 13px 'DM Sans'}
.dx-of-search{display:flex;width:300px;max-width:100%;height:44px;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--gr)}
.dx-of-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.dx-of-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--hd)}
.dx-of-chips{display:flex;flex:1;min-width:0;gap:8px;flex-wrap:wrap}
.dx-of-chip{display:inline-flex;height:36px;align-items:center;gap:8px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.dx-of-chip i{width:8px;height:8px;border-radius:50%;background:var(--gr)}
.dx-of-chip b{min-width:22px;padding:1px 7px;border-radius:999px;background:var(--grb2);color:var(--grf2);font-size:12px;text-align:center}
.dx-of-chip.is-on{border-color:var(--n);box-shadow:inset 0 0 0 1px var(--n);background:var(--hov)}
/* Estados de la OF */
.st-borrador{--c:#6B7280}.st-en_ingenieria{--c:#2F6FD6}.st-aprobada{--c:#00ACC1}.st-en_produccion{--c:#2F6FD6}.st-en_calidad{--c:#5B3A8C}.st-lista_entrega{--c:#E08A00}.st-entregada,.st-cerrada{--c:#16A34A}.st-anulada{--c:#DC2626}
.dx-of-chip i[class^=st-]{background:var(--c)}
.dx-of-pill{display:inline-flex;width:max-content;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.dx-of-pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.dx-of-pill.st-borrador{background:var(--grb2);color:var(--grf2)}
.dx-of-pill.st-en_ingenieria,.dx-of-pill.st-en_produccion{background:var(--blb);color:var(--blf)}
.dx-of-pill.st-aprobada{background:var(--cyb);color:var(--cyf)}
.dx-of-pill.st-en_calidad{background:var(--vib);color:var(--vi)}
.dx-of-pill.st-lista_entrega{background:var(--amb);color:var(--amf)}
.dx-of-pill.st-entregada,.dx-of-pill.st-cerrada{background:var(--grb);color:var(--grf)}
.dx-of-pill.st-anulada{background:var(--rdb);color:var(--rdf)}
.dx-of-pill.is-fab{background:var(--cyb);color:var(--cyf)}.dx-of-pill.is-mix{background:var(--vib);color:var(--vi)}
/* Filas de la bandeja */
.dx-of-cols{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(190px,1.5fr) 132px minmax(110px,.8fr) minmax(120px,.9fr) 120px 112px 20px;column-gap:14px;align-items:center;padding-inline:20px}
.dx-of-head{height:40px;border-bottom:1px solid var(--line);background:var(--hd);color:var(--gr);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dx-of-head .r{text-align:right}
.dx-of-row{min-height:84px;padding-block:14px;border-bottom:1px solid var(--line2);cursor:pointer}
.dx-of-row:hover{background:var(--hov)}.dx-of-row:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}
.dx-of-of{display:flex;min-width:0;align-items:flex-start;gap:12px}
.dx-of-ofi{display:flex;width:40px;height:40px;flex:none;align-items:center;justify-content:center;border-radius:10px;background:var(--cyb);color:var(--cyf)}
.dx-of-cell{display:flex;min-width:0;flex-direction:column;gap:2px}
.dx-of-num{color:var(--n);font:700 13px ui-monospace,Menlo,monospace}
.dx-of-strong{overflow:hidden;color:var(--n);font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.dx-of-muted{overflow:hidden;color:var(--gr);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.dx-of-tag{width:max-content;max-width:100%;overflow:hidden;margin-top:2px;padding:1px 7px;border-radius:6px;background:var(--grb2);color:var(--grf2);font-size:11px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.dx-of-tag.is-warn{background:var(--amb);color:var(--amf)}
.dx-of-tag.is-red{background:var(--rdb);color:var(--rdf)}
.dx-of-prog{display:flex;flex-direction:column;gap:5px}
.dx-of-prog b{color:var(--n);font:700 13px Sora}
.dx-of-bar2{height:6px;overflow:hidden;border-radius:999px;background:var(--grb2)}.dx-of-bar2 i{display:block;height:100%;border-radius:999px;background:var(--cy)}
.dx-of-money{color:var(--n);font:700 14px Sora;white-space:nowrap;text-align:right}
.dx-of-date{text-align:right}.dx-of-date .dx-of-muted{text-align:right}
.dx-of-date .is-late{color:var(--rdf)}.dx-of-date .is-soon{color:var(--amf)}
.dx-of-arrow{color:var(--gr)}
.dx-of-pag{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;color:var(--gr);font-size:13px}
/* ===== Crear OF ===== */
.dx-of-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.dx-of-sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.dx-of-sec:last-child{border-bottom:0}
.dx-of-sec h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;color:var(--n);font:700 15px Sora}
.dx-of-sec h3 .n{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;background:var(--n);color:var(--card);font:700 12px Sora}
[data-theme='dark'] .dx-of-sec h3 .n{background:#00ACC1;color:#02161A}
.dx-of-help{margin:0 0 14px;color:var(--gr);font-size:13px}
.dx-of-field{position:relative;display:flex;flex-direction:column;gap:6px;max-width:560px}
.dx-of-field label{min-height:18px;color:var(--grf2);font-size:12px;font-weight:700}
.dx-of-req{color:var(--rd)}
.dx-of-combo{display:flex;height:40px;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--gr)}
.dx-of-combo input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.dx-of-combo:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 20%,transparent)}
.dx-of-pop{position:absolute;z-index:20;top:70px;left:0;right:0;max-height:300px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 12px 32px #0f1b3024}
.dx-of-opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:inherit;text-align:left}
.dx-of-opt:hover,.dx-of-opt.is-act{background:var(--hov)}
.dx-of-opt .dx-of-muted{grid-column:1}
.dx-of-resolved{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--hd)}
.dx-of-resolved .dx-of-cell{flex:1 1 200px;min-width:0}
.dx-of-notice{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--amb);color:var(--amf);font-size:13px}
.dx-of-notice.is-info{background:var(--cyb);color:var(--cyf)}
.dx-of-radio{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dx-of-radio label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.dx-of-radio label.is-on{border-color:var(--n);box-shadow:inset 0 0 0 1px var(--n)}
.dx-of-radio input{margin-top:3px;accent-color:#1A2B4A}
/* Ruta (vista previa y ficha) */
.dx-of-trab{container-type:inline-size;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dx-of-trab-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--hd);border-bottom:1px solid var(--line)}
.dx-of-trab-h b{color:var(--n);font:700 14px Sora}
.dx-of-act{padding:8px 14px 0;color:var(--gr);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dx-of-op{display:grid;grid-template-columns:28px minmax(140px,1.4fr) minmax(110px,1fr) 104px minmax(130px,1.1fr) minmax(130px,1.1fr) 90px;column-gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
.dx-of-op:first-of-type{border-top:0}
.dx-of-op.is-head{color:var(--gr);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-top:0;padding-block:8px}
.dx-of-op .seq{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:7px;background:var(--grb2);color:var(--grf2);font:700 12px Sora}
.dx-of-op .r{text-align:right}
.dx-of-op .dx-of-muted,.dx-of-op .dx-of-strong{white-space:normal}
.dx-of-k{display:none;color:var(--gr);font-size:11px;font-weight:700}
.dx-of-empty{padding:28px 16px;color:var(--gr);text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:12px}
/* Aside */
.dx-of-aside{position:sticky;top:60px;display:flex;flex-direction:column;gap:12px}
.dx-of-aside .dx-of-card{padding:16px 18px}
.dx-of-aside h4{margin:0 0 10px;color:var(--n);font:700 14px Sora}
.dx-of-dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:13px}
.dx-of-dl dt{color:var(--gr)}.dx-of-dl dd{margin:0;color:var(--ink);font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.dx-of-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dx-of-total span{color:var(--gr);font-weight:700}.dx-of-total b{color:var(--n);font:700 22px Sora}
.dx-of-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;margin-top:16px;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
/* ===== Ficha ===== */
.dx-of-hdr{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.dx-of-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;border:0;background:none;padding:0;color:var(--cyf);font-weight:700}
.dx-of-tl{display:flex;margin-bottom:16px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow-x:auto}
.dx-of-tl div{position:relative;display:flex;flex:1;min-width:92px;flex-direction:column;align-items:center;gap:6px;color:var(--gr);font-size:11px;font-weight:700;text-align:center}
.dx-of-tl div::before{content:'';position:absolute;top:9px;left:-50%;right:50%;height:2px;background:var(--line)}
.dx-of-tl div:first-child::before{display:none}
.dx-of-tl i{position:relative;z-index:1;width:20px;height:20px;border:2px solid var(--bd);border-radius:50%;background:var(--card)}
.dx-of-tl .is-now{color:var(--n)}.dx-of-tl .is-now i{border-color:var(--cy);background:var(--cy);box-shadow:0 0 0 4px var(--cyb)}
.dx-of-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px;padding:18px 20px}
.dx-of-fields .dx-of-cell span:first-child{color:var(--gr);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-of-fields .dx-of-cell span:last-child{color:var(--ink);font-weight:600}
.dx-of-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}
.dx-of-tabs button{height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--gr);font-weight:700}
.dx-of-tabs button.is-on{border-color:var(--cy);color:var(--n)}
.dx-of-soon{margin:14px 20px 18px;padding:12px 14px;border-radius:10px;background:var(--grb2);color:var(--grf2);font-size:13px}
.view{display:none}.view.on{display:block}
/* ===== Responsive por contenedor ===== */
@container (max-width:1100px){
 .dx-of-kpi .dx-of-ico{display:none}
 .dx-of-cols{grid-template-columns:minmax(150px,1.1fr) minmax(160px,1.4fr) 124px minmax(90px,.7fr) minmax(110px,.9fr) 110px 100px 16px;column-gap:12px;padding-inline:16px}
 .dx-of-grid{grid-template-columns:minmax(0,1fr) 280px}
}
@container (max-width:900px){
 .dx-of-in{padding:18px 16px 32px}
 .dx-of-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .dx-of-bar h2{width:100%}.dx-of-search{flex:1 1 100%;width:auto}
 .dx-of-head{display:none}
 .dx-of-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'of estado' 'cli cli' 'prog ops' 'cost date';gap:10px 14px;padding:14px 16px}
 .a-of{grid-area:of}.a-st{grid-area:estado;justify-self:end}.a-cli{grid-area:cli}.a-prog{grid-area:prog}.a-ops{grid-area:ops;justify-self:end;text-align:right}.a-cost{grid-area:cost;text-align:left}.a-date{grid-area:date}.a-arrow{display:none}
 .dx-of-grid{grid-template-columns:minmax(0,1fr)}.dx-of-aside{position:static}
 .dx-of-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* La ruta responde al ancho de su propia tarjeta */
@container (max-width:760px){
 .dx-of-op{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:'seq tar cost' 'seq car car' 'seq hh hh' 'seq eq eq' 'seq bah bah';row-gap:4px}
 .dx-of-op.is-head{display:none}
 .o-seq{grid-area:seq;align-self:start}.o-tar{grid-area:tar}.o-car{grid-area:car}.o-hh{grid-area:hh}.o-eq{grid-area:eq}.o-bah{grid-area:bah}.o-cost{grid-area:cost}
 .dx-of-k{display:inline;margin-right:6px}
}
@container (max-width:600px){
 .dx-of-title{font-size:24px}
 .dx-of-top .dx-of-primary{width:100%;justify-content:center}
 .dx-of-kpi{padding:12px 14px}.dx-of-kpi-val{font-size:22px}
 .dx-of-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
 .dx-of-row{grid-template-areas:'of of' 'estado estado' 'cli cli' 'prog prog' 'ops ops' 'cost date'}
 .a-st{justify-self:start}.a-ops{justify-self:start;text-align:left}
 .dx-of-fields{grid-template-columns:1fr}
 .dx-of-foot .dx-of-primary,.dx-of-foot .dx-of-ghost{flex:1;justify-content:center}
}
/* ===== F3 · Ficha editable de la OF ===== */
/* Formularios y KPI: estándar dx-ui (mismas reglas que zahory.css) */
.dx-of{--dx-ui-navy:var(--n);--dx-ui-gray:var(--gr);--dx-ui-line:var(--line);--dx-ui-border:var(--bd);--dx-ui-card:var(--card);--dx-ui-ink:var(--ink);--dx-ui-red-fg:#9B2C2C}
[data-theme='dark'] .dx-of{--dx-ui-red-fg:#FCA5A5}

   <div class="dx-ui-field dx-ui-field-full"><span class="dx-ui-field-hint">La guía lleva las 2 unidades con su serie. Partida: dirección del taller.</span></div></div>`;
  if(paso===4)b=`<dl class="dx-ofe-cmp"><dt>Unidades</dt><dd>2 · OF-D0001-01, OF-D0001-02</dd><dt>Conformidad</dt><dd>Conforme · 2 fotos · firmas completas</dd><dt>Guía</dt><dd>T001 · Planta Andina, Ilo · ABC-123</dd><dt>Garantía</dt><dd>12 meses por unidad, hasta el 14 nov 2027</dd><dt>Después</dt><dd>La OF pasa a Entregada y aparece en Valorizaciones de la OS-2026-0154</dd></dl>

  const pie=`<div class="dx-ofe-actions"><button type="button" class="dx-of-ghost" data-close>Cancelar</button>${paso>1?'<button type="button" class="dx-of-ghost" data-paso="-1">Atrás</button>':''}${paso<4?'<button type="button" class="dx-of-primary" data-paso="1">Siguiente</button>':`<button type="button" class="dx-of-primary" data-v="entregada">${IC.check}Entregar y emitir guía</button>`}</div>`;
  h=`<form class="dx-ofe-modal" role="dialog" aria-modal="true" aria-labelledby="me" novalidate><h3 id="me">Entregar OF-D0001 al cliente</h3><p>Se genera el acta de conformidad en PDF, la guía de remisión y la garantía de cada unidad.</p>${st}${b}${pie}</form>`;
 }
 if(kind==='reclamo'){

  <div class="dx-ui-field dx-ui-field-full"><label>Fotos</label><div class="dx-of5-fotos"><div class="dx-of5-foto is-ok">Foto 1</div><div class="dx-of5-foto">+ Agregar</div></div></div></div>

 }

let v='lista';
function render(){
 const V=document.getElementById('view');
 V.innerHTML=v==='lista'?ficha('lista_entrega'):v==='entregada'?ficha('entregada'):v==='pasaporte'?pasaporte():v==='garantias'?garantias():valorizacion();
 document.querySelectorAll('.mockbar [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-v]');if(g){v=g.dataset.v;document.getElementById('modal').innerHTML='';render();return}
 const m=e.target.closest('[data-m]');if(m){if(m.dataset.m==='entregar'){paso=1;v='lista';render()}modal(m.dataset.m);return}
 const p=e.target.closest('[data-paso]');if(p){paso=Math.min(4,Math.max(1,paso+Number(p.dataset.paso)));modal('entregar');return}
 if(e.target.closest('[data-close]')||e.target.classList.contains('dx-ofe-backdrop')){document.getElementById('modal').innerHTML='';return}
 if(e.target.id==='tema'){document.documentElement.toggleAttribute('data-theme');if(document.documentElement.hasAttribute('data-theme'))document.documentElement.setAttribute('data-theme','dark');e.target.textContent=document.documentElement.hasAttribute('data-theme')?'Modo claro':'Modo oscuro'}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').innerHTML=''});
render();
