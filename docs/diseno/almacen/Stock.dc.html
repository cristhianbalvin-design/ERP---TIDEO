<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Almacén WMS — Fase 2a (Inventario &amp; Kardex)</title>
<style>
/* Variables copiadas de zahory.css, sección DX-UI base */
.dx-ui{
  --dx-ui-navy:#1A2B4A; --dx-ui-cyan:#00ACC1; --dx-ui-cyan-fg:#0B4F5A; --dx-ui-violet:#5B3A8C;
  --dx-ui-gray:#6B7280; --dx-ui-line:#E4E7EB; --dx-ui-line-soft:#EEF0F3; --dx-ui-border:#C9CFD8;
  --dx-ui-bg:#F4F6F8; --dx-ui-head:#F8F9FA; --dx-ui-card:#FFFFFF; --dx-ui-ink:#1F2937;
  --dx-ui-hover:#F6FBFC; --dx-ui-cyan-bg:#E0F7FA; --dx-ui-violet-bg:#F0EAFB;
  --dx-ui-amber-bg:#FFF3E0; --dx-ui-amber-fg:#8A4B00; --dx-ui-amber-dot:#E08A00;
  --dx-ui-green-bg:#E3F6EA; --dx-ui-green-fg:#14633A;
  --dx-ui-red-bg:#FDE8E7; --dx-ui-red-fg:#9B2C2C; --dx-ui-red-dot:#DC2626;
  --dx-ui-gray-bg:#F1F3F5; --dx-ui-gray-fg:#4B5563; --dx-ui-gray-dot:#6B7280;
  width:100%; margin-bottom:18px; color:var(--dx-ui-ink); font:14px/1.4 'DM Sans',system-ui,sans-serif;
}
[data-theme='dark'] .dx-ui{
  --dx-ui-navy:#F8FAFC; --dx-ui-cyan:#22D3EE; --dx-ui-cyan-fg:#67E8F9; --dx-ui-violet:#D8B4FE;
  --dx-ui-gray:#94A3B8; --dx-ui-line:rgba(255,255,255,.1); --dx-ui-line-soft:rgba(255,255,255,.08); --dx-ui-border:#475569;
  --dx-ui-bg:#020617; --dx-ui-head:#0F172A; --dx-ui-card:#1E293B; --dx-ui-ink:#F8FAFC;
  --dx-ui-hover:#172033; --dx-ui-cyan-bg:#0A3038; --dx-ui-violet-bg:#321B3B;
  --dx-ui-amber-bg:#3A2810; --dx-ui-amber-fg:#FDBA74; --dx-ui-amber-dot:#F59E0B;
  --dx-ui-green-bg:#12351F; --dx-ui-green-fg:#86EFAC;
  --dx-ui-red-bg:#3B1D20; --dx-ui-red-fg:#FCA5A5; --dx-ui-red-dot:#F87171;
  --dx-ui-gray-bg:#273244; --dx-ui-gray-fg:#CBD5E1; --dx-ui-gray-dot:#94A3B8;
}
*{box-sizing:border-box}
body{margin:0;background:#F4F6F8;font-family:'DM Sans',system-ui,sans-serif}
[data-theme='dark'] body{background:#020617}
.mock-shell{display:flex;min-height:100vh}
.mock-side{width:240px;flex:none;background:#1A2B4A;color:#fff;padding:18px 14px}
.mock-side b{display:block;font:700 15px 'Sora',sans-serif;margin-bottom:16px}
.mock-side span{display:block;padding:9px 10px;border-radius:8px;font-size:13px;color:#C7D2E4}
.mock-side span.on{background:rgba(255,255,255,.12);color:#fff}
.mock-side small{display:block;margin:14px 10px 6px;font-size:10px;letter-spacing:.08em;color:#8FA2C0}
.mock-main{flex:1;min-width:0;padding:24px 28px}
@media (max-width:900px){.mock-side{display:none}.mock-main{padding:16px}}

.dx-ui-head-page{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dx-ui-eyebrow{color:var(--dx-ui-cyan);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dx-ui-title{margin:2px 0 0;color:var(--dx-ui-navy);font:700 24px/1.2 'Sora',sans-serif}
.dx-ui-sub{margin:4px 0 0;color:var(--dx-ui-gray)}
.dx-ui-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dx-btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--dx-ui-border);background:var(--dx-ui-card);color:var(--dx-ui-navy);font:600 14px 'DM Sans',sans-serif;cursor:pointer}
.dx-btn.primary{background:var(--dx-ui-navy);color:var(--dx-ui-card);border-color:var(--dx-ui-navy)}
[data-theme='dark'] .dx-btn.primary{color:#0F172A}
.dx-btn:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-btn[disabled]{background:var(--dx-ui-gray-bg);color:var(--dx-ui-gray-fg);border-color:var(--dx-ui-line);cursor:not-allowed}

.dx-ui-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.dx-ui-tab{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--dx-ui-line);background:var(--dx-ui-card);color:var(--dx-ui-gray);font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.dx-ui-tab.on{background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg);border-color:transparent}

/* Base compartida (copia de zahory.css) */
.dx-ui-summary { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.dx-ui-chip { display:flex; align-items:baseline; gap:8px; padding:8px 16px; border:1px solid var(--dx-ui-line); border-radius:10px; background:var(--dx-ui-card); }
.dx-ui-chip b { color:var(--dx-ui-navy); font:700 20px 'Sora',sans-serif; }
.dx-ui-chip span { color:var(--dx-ui-gray); font-size:12px; }
.dx-ui-card { container-type:inline-size; overflow:hidden; width:100%; border:1px solid var(--dx-ui-line); border-radius:14px; background:var(--dx-ui-card); box-shadow:0 1px 2px rgba(15,27,48,.04); margin-bottom:16px; }
.dx-ui-toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--dx-ui-line); }
.dx-ui-toolbar h2 { margin:0 auto 0 0; color:var(--dx-ui-navy); font:700 16px/1.4 'Sora',sans-serif; }
.dx-ui-count { color:var(--dx-ui-gray); font-size:12px; white-space:nowrap; }
.dx-ui-search { display:flex; align-items:center; gap:8px; width:340px; max-width:100%; height:40px; padding:0 12px; border:1px solid var(--dx-ui-border); border-radius:8px; background:var(--dx-ui-card); color:var(--dx-ui-gray); }
.dx-ui-search:focus-within { border-color:var(--dx-ui-cyan); box-shadow:0 0 0 3px color-mix(in srgb,var(--dx-ui-cyan) 15%,transparent); }
.dx-ui-search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--dx-ui-ink); font:14px 'DM Sans',sans-serif; }
.dx-ui-head,.dx-ui-row { display:grid; grid-template-columns:var(--dx-ui-cols,minmax(0,1fr)); column-gap:16px; align-items:center; padding-inline:20px; }
.dx-ui-head { min-height:38px; border-bottom:1px solid var(--dx-ui-line); background:var(--dx-ui-head); color:var(--dx-ui-gray); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.dx-ui-row { min-height:68px; border-bottom:1px solid var(--dx-ui-line-soft); cursor:pointer; transition:background .12s; }
.dx-ui-row:last-child { border-bottom:0; }
.dx-ui-row:hover { background:var(--dx-ui-hover); }
.dx-ui-row:hover .dx-ui-arrow { color:var(--dx-ui-navy); transform:translateX(2px); }
.dx-ui-row:focus-visible { position:relative; z-index:1; outline:2px solid var(--dx-ui-cyan); outline-offset:-2px; }
.dx-ui-icon { display:flex; flex:none; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; }
.dx-ui-icon.is-cyan { background:var(--dx-ui-cyan-bg); color:var(--dx-ui-cyan-fg); }
.dx-ui-icon.is-violet { background:var(--dx-ui-violet-bg); color:var(--dx-ui-violet); }
.dx-ui-pill { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
.dx-ui-pill i { width:6px; height:6px; flex:none; border-radius:50%; background:currentColor; }
.dx-ui-pill.is-amber { background:var(--dx-ui-amber-bg); color:var(--dx-ui-amber-fg); }
.dx-ui-pill.is-amber i { background:var(--dx-ui-amber-dot); }
.dx-ui-pill.is-green { background:var(--dx-ui-green-bg); color:var(--dx-ui-green-fg); }
.dx-ui-pill.is-red { background:var(--dx-ui-red-bg); color:var(--dx-ui-red-fg); }
.dx-ui-pill.is-red i { background:var(--dx-ui-red-dot); }
.dx-ui-pill.is-gray { background:var(--dx-ui-gray-bg); color:var(--dx-ui-gray-fg); }
.dx-ui-pill.is-gray i { background:var(--dx-ui-gray-dot); }
.dx-ui-pill.is-cyan { background:var(--dx-ui-cyan-bg); color:var(--dx-ui-cyan-fg); }
.dx-ui-arrow { color:#9AA3B2; transition:.12s; }
.dx-ui-empty { padding:48px 20px; color:var(--dx-ui-gray); text-align:center; }
@container (max-width:760px) {
  .dx-ui-head { display:none; }
  .dx-ui-row { row-gap:8px; padding:14px 16px; }
}
/* Reglas propias: Stock y Kardex (dx-stk-) */
.dx-stk-cols { --dx-ui-cols:minmax(0,1fr) 84px 96px 104px 116px 124px 20px; }
.dx-stk-main{display:flex;align-items:center;gap:12px;min-width:0}
.dx-stk-main > span:last-child{min-width:0}
.dx-stk-main b{display:block;color:var(--dx-ui-navy);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dx-stk-main small{display:block;color:var(--dx-ui-gray);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@container (max-width:860px){.dx-stk-kcols .dx-stk-main b,.dx-stk-kcols .dx-stk-main small,.dx-stk-dcols .dx-stk-main b,.dx-stk-dcols .dx-stk-main small{white-space:normal}}
.dx-stk-n{font:600 14px 'Sora',sans-serif;color:var(--dx-ui-navy);text-align:right;white-space:nowrap}
.dx-stk-n small{display:block;font:500 11px 'DM Sans',sans-serif;color:var(--dx-ui-gray)}
.dx-stk-n.is-low{color:var(--dx-ui-amber-fg)}
.dx-stk-n.is-out{color:var(--dx-ui-red-fg)}
.dx-stk-lbl{display:none;color:var(--dx-ui-gray);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-stk-filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--dx-ui-line)}
.dx-stk-sel{height:36px;min-width:170px;padding:0 12px;border-radius:999px;border:1px solid var(--dx-ui-border);background:var(--dx-ui-card);color:var(--dx-ui-ink);font:600 13px 'DM Sans',sans-serif}
.dx-stk-sel:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-stk-note{margin-bottom:16px;padding:12px 16px;border-radius:10px;background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg);font-size:13px}
.dx-stk-chip-hl b{color:var(--dx-ui-cyan-fg)}
.dx-stk-chip-warn b{color:var(--dx-ui-amber-fg)}
.dx-stk-chip-bad b{color:var(--dx-ui-red-fg)}
@container (max-width:860px){
  .dx-stk-cols { --dx-ui-cols:repeat(3,minmax(0,1fr)) auto; grid-template-areas:"main main main pill" "fis disp val val"; }
  .dx-stk-cols > :nth-child(1){grid-area:main}
  .dx-stk-cols > :nth-child(2){grid-area:fis}
  .dx-stk-cols > :nth-child(3){grid-area:disp}
  .dx-stk-cols > :nth-child(4){display:none}
  .dx-stk-cols > :nth-child(5){grid-area:val}
  .dx-stk-cols > :nth-child(6){grid-area:pill;justify-self:end}
  .dx-stk-cols > .dx-ui-arrow{display:none}
  .dx-stk-cols .dx-stk-n{text-align:left}
  .dx-stk-cols .dx-stk-lbl{display:block}
}
/* Kardex global */
.dx-stk-kcols { --dx-ui-cols:96px minmax(0,1fr) 132px 84px 96px 84px 20px; }
.dx-stk-date{color:var(--dx-ui-gray);font-size:13px;white-space:nowrap}
.dx-stk-qty{font:700 14px 'Sora',sans-serif;text-align:right;white-space:nowrap}
.dx-stk-qty.in{color:var(--dx-ui-green-fg)}
.dx-stk-qty.out{color:var(--dx-ui-amber-fg)}
.dx-stk-kcols.is-void{opacity:.5}
.dx-stk-kcols.is-void .dx-stk-main b{text-decoration:line-through}
@container (max-width:860px){
  .dx-stk-kcols { --dx-ui-cols:repeat(3,minmax(0,1fr)); grid-template-areas:"main main main" "date pill pill" "cost qty bal"; }
  .dx-stk-kcols > :nth-child(1){grid-area:date}
  .dx-stk-kcols > :nth-child(2){grid-area:main}
  .dx-stk-kcols > :nth-child(3){grid-area:pill;justify-self:end}
  .dx-stk-kcols > :nth-child(4){grid-area:qty;justify-self:center}
  .dx-stk-kcols > :nth-child(5){grid-area:cost}
  .dx-stk-kcols > :nth-child(6){grid-area:bal;justify-self:end}
  .dx-stk-kcols > .dx-ui-arrow{display:none}
  .dx-stk-kcols .dx-stk-n{text-align:left}
  .dx-stk-kcols > :nth-child(6).dx-stk-n{text-align:right}
}
/* Detalle de material */
.dx-stk-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;color:var(--dx-ui-cyan-fg);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;font-size:14px}
.dx-stk-back:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-stk-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:16px 20px;border-bottom:1px solid var(--dx-ui-line)}
.dx-stk-meta div small{display:block;color:var(--dx-ui-gray);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-stk-meta div span{display:block;margin-top:2px;color:var(--dx-ui-navy);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-width:860px){.dx-stk-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dx-stk-wcols { --dx-ui-cols:minmax(0,1fr) 120px 96px 76px 84px; cursor:default; }
.dx-stk-wcols.dx-ui-row{cursor:default;min-height:60px}
.dx-stk-wcols.dx-ui-row:hover{background:transparent}
@container (max-width:860px){
  .dx-stk-wcols { --dx-ui-cols:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"main main" "uso lote" "fis res"; }
  .dx-stk-wcols > :nth-child(1){grid-area:main}
  .dx-stk-wcols > :nth-child(2){grid-area:uso}
  .dx-stk-wcols > :nth-child(3){grid-area:lote}
  .dx-stk-wcols > :nth-child(4){grid-area:fis}
  .dx-stk-wcols > :nth-child(5){grid-area:res}
  .dx-stk-wcols .dx-stk-n{text-align:left}
  .dx-stk-wcols .dx-stk-lbl{display:block}
}
.dx-stk-dcols { --dx-ui-cols:96px 132px minmax(0,1fr) 84px 96px 84px; cursor:default; }
.dx-stk-dcols.dx-ui-row{cursor:default;min-height:60px}
.dx-stk-dcols.dx-ui-row:hover{background:transparent}
.dx-stk-dcols.is-void{opacity:.5}
@container (max-width:860px){
  .dx-stk-dcols { --dx-ui-cols:repeat(3,minmax(0,1fr)); grid-template-areas:"main main main" "date pill pill" "cost qty bal"; }
  .dx-stk-dcols > :nth-child(1){grid-area:date}
  .dx-stk-dcols > :nth-child(2){grid-area:pill;justify-self:end}
  .dx-stk-dcols > :nth-child(3){grid-area:main}
  .dx-stk-dcols > :nth-child(4){grid-area:qty;justify-self:center}
  .dx-stk-dcols > :nth-child(5){grid-area:cost}
  .dx-stk-dcols > :nth-child(6){grid-area:bal;justify-self:end}
  .dx-stk-dcols .dx-stk-n{text-align:left}
  .dx-stk-dcols > :nth-child(6).dx-stk-n{text-align:right}
}
@container (max-width:860px){
  .dx-ui-head.dx-stk-cols,.dx-ui-head.dx-stk-kcols,.dx-ui-head.dx-stk-wcols,.dx-ui-head.dx-stk-dcols{display:none}
  .dx-ui-row.dx-stk-cols,.dx-ui-row.dx-stk-kcols,.dx-ui-row.dx-stk-wcols,.dx-ui-row.dx-stk-dcols{row-gap:8px;padding:14px 16px}
}
.theme-toggle{position:fixed;right:14px;bottom:14px;z-index:5;height:40px;padding:0 14px;border-radius:999px;border:1px solid #C9CFD8;background:#fff;color:#1A2B4A;font:600 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="mock-shell">
  <aside class="mock-side">
    <b>TIDEO · Operaciones</b>
    <small>ALMACÉN</small>
    <span class="on">Inventario &amp; Kardex</span>
    <span>Entradas &amp; Salidas</span>
    <span>Recepciones</span>
    <span>Ubicaciones</span>
    <span>Reserva de Repuestos</span>
    <span>Stock Mínimos &amp; Alertas</span>
  </aside>
  <main class="mock-main">
    <section class="dx-ui dx-stk" id="root">
      <div class="dx-ui-head-page">
        <div>
          <div class="dx-ui-eyebrow">Almacén · WMS</div>
          <h1 class="dx-ui-title" id="pageTitle">Inventario &amp; Kardex</h1>
          <p class="dx-ui-sub" id="pageSub">Qué hay, dónde está y cuánto vale, con el historial de cada movimiento.</p>
        </div>
        <div class="dx-ui-actions" id="pageActions"></div>
      </div>
      <div class="dx-ui-tabs" role="tablist" id="tabs">
        <button class="dx-ui-tab on" role="tab" data-view="stock">Stock</button>
        <button class="dx-ui-tab" role="tab" data-view="kardex">Kardex</button>
      </div>
      <div id="view"></div>
    </section>
  </main>
</div>
<button class="theme-toggle" id="themeBtn" aria-label="Cambiar tema claro u oscuro">Modo oscuro</button>

<script>

 {id:'M8', cod:'MAT-003377', nombre:'Pernos grado 8 1/2" x 2"', cat:'Ferretería', und:'und', ctl:'Sin control', cp:1.90, reorden:100,seg:20, stock:[]},
 {id:'M9', cod:'MAT-000099', nombre:'Tambor lubricante 200 L', cat:'Lubricantes', und:'und', ctl:'Por lote', cp:1150.00, reorden:2,seg:1,
  stock:[{alm:'ALM-001',ubi:'Z-A-PISO',lote:'L-0930',fis:18,res:4}]}
];
/* tipo: ent | sal | tin | tout | aju */
const K0 = [
 ['2026-09-02','M1','ALM-001','GEN','ent','Saldo inicial','Carga inicial',9,82.00,'def'],
 ['2026-09-18','M1','ALM-001','CUA','ent','Recepción de OC','OC-26-0412',14,88.00,'def'],
 ['2026-09-24','M1','ALM-001','GEN','tout','Transferencia','TR-0031',-9,85.81,'def'],
 ['2026-09-24','M1','ALM-002','GEN','tin','Transferencia','TR-0031',9,85.81,'def'],
 ['2026-10-02','M1','ALM-002','GEN','sal','Consumo OT','OT-26-0688',-2,85.81,'def'],
 ['2026-10-05','M1','ALM-001','Z-A-R01-P01','ent','Recepción de OC','OC-26-0455',6,86.40,'def'],
 ['2026-09-02','M2','ALM-001','GEN','ent','Saldo inicial','Carga inicial',300,17.80,'def'],
 ['2026-09-30','M2','ALM-001','GEN','ent','Recepción de OC','OC-26-0430',93,18.60,'def'],
 ['2026-10-08','M2','ALM-001','ZONA-TEST','ent','Recepción de OC','OC-018 (prueba)',1,18.50,'def'],
 ['2026-09-02','M3','ALM-001','Z-A-R01-P01','ent','Saldo inicial','Carga inicial',16,312.00,'def'],
 ['2026-10-01','M3','ALM-001','Z-A-R01-P01','sal','Consumo OT','OT-26-0681',-2,312.00,'def'],
 ['2026-09-02','M4','ALM-001','Z-B-R01','ent','Saldo inicial','Carga inicial',640,14.20,'def'],
 ['2026-09-20','M4','ALM-001','Z-B-R01','sal','Consumo OT','OT-26-0650',-20,14.20,'def'],
 ['2026-09-12','M5','ALM-001','Z-B-R01','ent','Recepción de OC','OC-26-0398',360,6.80,'def'],
 ['2026-09-02','M6','ALM-001','GEN','ent','Saldo inicial','Carga inicial',30,41.00,'def'],
 ['2026-09-28','M6','ALM-001','GEN','sal','Consumo OT','OT-26-0670',-5,41.00,'def'],
 ['2026-09-02','M7','ALM-001','GEN','ent','Saldo inicial','Carga inicial',40,58.00,'def'],
 ['2026-09-02','M8','ALM-001','GEN','ent','Saldo inicial','Carga inicial',50,1.90,'def'],
 ['2026-09-15','M8','ALM-001','GEN','sal','Consumo OT','OT-26-0662',-50,1.90,'def'],
 ['2026-09-16','M8','ALM-001','GEN','ent','Entrada manual','Anulada por error de conteo',10,1.90,'def',true],
 ['2026-10-09','M9','ALM-001','Z-A-PISO','ent','Recepción de OC','OC-26-0460',18,1150.00,'prov']
];
/* saldo corrido por material */
const KARDEX = (()=>{
  const rows = K0.map((r,i)=>({id:i,fecha:r[0],mat:r[1],alm:r[2],ubi:r[3],tipo:r[4],motivo:r[5],ref:r[6],cant:r[7],costo:r[8],val:r[9],anulado:!!r[10]}));
  rows.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.id-b.id);
  const run={}; rows.forEach(r=>{ run[r.mat]=run[r.mat]||0; if(!r.anulado) run[r.mat]+=r.cant; r.saldo=run[r.mat]; });
  return rows.reverse();
})();

const ICON_BOX = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>';
const ICON_ARROW = '<svg class="dx-ui-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_SEARCH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

let view='stock', matSel=null, q='', fAlm='', fEst='', fTipo='', kAlm='', kTipo='';
const $ = s => document.querySelector(s);
const money = n => 'S/ ' + Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const int = n => Number(n).toLocaleString('es-PE');
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate = s => { const [y,m,d]=s.split('-'); return d+' '+MES[+m-1]+' '+y; };
const almNom = id => ALMACENES.find(a=>a.id===id).nombre;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function calc(m){
  const fis=m.stock.reduce((s,x)=>s+x.fis,0), res=m.stock.reduce((s,x)=>s+x.res,0);
  const cua=m.stock.filter(x=>UB[x.ubi].uso!=='almacenaje').reduce((s,x)=>s+x.fis,0);
  const disp=Math.max(fis-res-cua,0);
  const est = disp===0 ? 'agotado' : disp<=m.reorden+m.seg ? 'bajo' : 'normal';
  const alms=[...new Set(m.stock.map(x=>x.alm))].map(a=>almNom(a).replace('Almacén ',''));
  return {fis,res,cua,disp,val:fis*m.cp,est,alms};
}
const pillEst = e => e==='agotado' ? '<span class="dx-ui-pill is-red"><i></i>Agotado</span>'
  : e==='bajo' ? '<span class="dx-ui-pill is-amber"><i></i>Bajo reorden</span>'
  : '<span class="dx-ui-pill is-green"><i></i>Normal</span>';
const TIPOS={ent:['Entrada','is-green'],sal:['Salida','is-amber'],tin:['Transf. entrada','is-cyan'],tout:['Transf. salida','is-cyan'],aju:['Ajuste','is-gray']};
const pillTipo = t => `<span class="dx-ui-pill ${TIPOS[t][1]}"><i></i>${TIPOS[t][0]}</span>`;
const pillVal = v => v==='def' ? '<span class="dx-ui-pill is-green"><i></i>Definitiva</span>' : '<span class="dx-ui-pill is-amber"><i></i>Provisional</span>';
const qtyCls = c => c>0?'in':'out';
const qtyTxt = c => (c>0?'+':'−')+int(Math.abs(c));
const selAlm = (id,val) => `<select class="dx-stk-sel" id="${id}" aria-label="Filtrar por almacén"><option value="">Todos los almacenes</option>${ALMACENES.map(a=>`<option value="${a.id}" ${val===a.id?'selected':''}>${a.nombre}</option>`).join('')}</select>`;
const selTipo = (id,val) => `<select class="dx-stk-sel" id="${id}" aria-label="Filtrar por tipo de movimiento"><option value="">Todos los tipos</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${val===k?'selected':''}>${v[0]}</option>`).join('')}</select>`;

function keepSearch(){ const n=$('#q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }
function bindOpen(sel, fn){
  document.querySelectorAll(sel).forEach(r=>{
    const go=()=>fn(r);
    r.addEventListener('click',go);
    r.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
}

function render(){
  document.querySelectorAll('#tabs .dx-ui-tab').forEach(t=>t.classList.toggle('on', t.dataset.view===view));
  $('#tabs').style.display = matSel ? 'none' : '';
  if(matSel) return renderDetalle();
  if(view==='kardex') return renderKardex();
  renderStock();
}

function renderStock(){
  $('#pageTitle').textContent='Inventario & Kardex';
  $('#pageSub').textContent='Qué hay, dónde está y cuánto vale, con el historial de cada movimiento.';
  $('#pageActions').innerHTML='';
  const data = MATS.map(m=>({m,c:calc(m)})).filter(({m,c})=>{
    const txt=(m.nombre+m.cod+m.cat).toLowerCase().includes(q.toLowerCase());
    const alm = !fAlm || m.stock.some(x=>x.alm===fAlm);
    const est = !fEst || c.est===fEst;
    return txt&&alm&&est;
  });
  const tot=MATS.map(calc), valor=tot.reduce((s,c)=>s+c.val,0);
  const rows = data.map(({m,c})=>`
    <div class="dx-ui-row dx-stk-cols" role="button" tabindex="0" data-mat="${m.id}" aria-label="Abrir ${esc(m.nombre)}">
      <div class="dx-stk-main"><span class="dx-ui-icon is-cyan">${ICON_BOX}</span><span><b>${esc(m.nombre)}</b><small>${m.cod} · ${m.cat} · ${c.alms.join(' + ')||'Sin stock'}</small></span></div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Físico</span>${int(c.fis)} <small>${m.und}</small></div>
      <div class="dx-stk-n ${c.est==='agotado'?'is-out':c.est==='bajo'?'is-low':''}"><span class="dx-stk-lbl">Disponible</span>${int(c.disp)}${c.cua?'<small>'+int(c.cua)+' en cuarentena</small>':'<small>&nbsp;</small>'}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Costo prom.</span>${money(m.cp)}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Valor</span>${money(c.val)}</div>
      <span>${pillEst(c.est)}</span>
      ${ICON_ARROW}
    </div>`).join('');
  $('#view').innerHTML=`
    <div class="dx-ui-summary">
      <div class="dx-ui-chip dx-stk-chip-hl"><b>${money(valor)}</b><span>Valor del inventario</span></div>
      <div class="dx-ui-chip"><b>${tot.filter(c=>c.fis>0).length}</b><span>Materiales con stock</span></div>
      <div class="dx-ui-chip dx-stk-chip-warn"><b>${tot.filter(c=>c.est==='bajo').length}</b><span>Bajo reorden</span></div>
      <div class="dx-ui-chip dx-stk-chip-bad"><b>${tot.filter(c=>c.est==='agotado').length}</b><span>Agotados</span></div>
    </div>
    <div class="dx-stk-note">El stock en <b>cuarentena</b> y <b>merma</b> cuenta como existencia física pero no como disponible: no se reserva ni se despacha. Los movimientos (entrada manual, transferencia, reubicación y despacho a taller) llegan en la siguiente fase.</div>
    <div class="dx-ui-card">
      <div class="dx-ui-toolbar"><h2>Materiales</h2><span class="dx-ui-count">${data.length} resultado(s)</span>
        <label class="dx-ui-search">${ICON_SEARCH}<input id="q" value="${esc(q)}" placeholder="Buscar por material, código o categoría" aria-label="Buscar material"></label></div>
      <div class="dx-stk-filters">${selAlm('fAlm',fAlm)}
        <select class="dx-stk-sel" id="fEst" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option value="normal" ${fEst==='normal'?'selected':''}>Normal</option><option value="bajo" ${fEst==='bajo'?'selected':''}>Bajo reorden</option><option value="agotado" ${fEst==='agotado'?'selected':''}>Agotado</option></select></div>
      <div class="dx-ui-head dx-stk-cols" aria-hidden="true"><span>Material</span><span>Físico</span><span>Disponible</span><span>Costo prom.</span><span>Valor</span><span>Estado</span><span></span></div>
      ${rows || '<div class="dx-ui-empty">Sin coincidencias para tu búsqueda.</div>'}
    </div>`;
  $('#q').addEventListener('input',e=>{ q=e.target.value; renderStock(); keepSearch(); });
  $('#fAlm').addEventListener('change',e=>{ fAlm=e.target.value; renderStock(); });
  $('#fEst').addEventListener('change',e=>{ fEst=e.target.value; renderStock(); });
  bindOpen('[data-mat]', r=>{ matSel=r.dataset.mat; fTipo=''; render(); window.scrollTo(0,0); });
}

function kRow(r, conMat){
  const m=MATS.find(x=>x.id===r.mat);
  const sub = `${almNom(r.alm).replace('Almacén ','')} · ${UB[r.ubi].n}`;
  const valtxt = r.anulado ? '<span class="dx-ui-pill is-gray"><i></i>Anulado</span>' : pillVal(r.val);
  if(conMat) return `
    <div class="dx-ui-row dx-stk-kcols ${r.anulado?'is-void':''}" role="button" tabindex="0" data-mat="${m.id}" aria-label="Abrir ${esc(m.nombre)}">
      <span class="dx-stk-date">${fdate(r.fecha)}</span>
      <span class="dx-stk-main"><span><b>${esc(m.nombre)}</b><small>${sub} · ${r.motivo}${r.ref?' · '+esc(r.ref):''}</small></span></span>
      <span>${pillTipo(r.tipo)}</span>
      <div class="dx-stk-qty ${qtyCls(r.cant)}">${qtyTxt(r.cant)}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Costo unit.</span>${money(r.costo)}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Saldo</span>${int(r.saldo)}</div>
      ${ICON_ARROW}
    </div>`;
  return `
    <div class="dx-ui-row dx-stk-dcols ${r.anulado?'is-void':''}">
      <span class="dx-stk-date">${fdate(r.fecha)}</span>
      <span>${pillTipo(r.tipo)}</span>
      <span class="dx-stk-main"><span><b>${r.motivo}${r.ref?' · '+esc(r.ref):''}</b><small>${sub}</small></span></span>
      <div class="dx-stk-qty ${qtyCls(r.cant)}">${qtyTxt(r.cant)}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Costo unit.</span>${money(r.costo)}<small>${valtxt}</small></div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Saldo</span>${int(r.saldo)}</div>
    </div>`;
}

function renderKardex(){
  $('#pageTitle').textContent='Kardex';
  $('#pageSub').textContent='Todos los movimientos de inventario, del más reciente al más antiguo.';
  $('#pageActions').innerHTML='';
  const f = KARDEX.filter(r=>{
    const m=MATS.find(x=>x.id===r.mat);
    return (m.nombre+m.cod+(r.ref||'')+r.motivo).toLowerCase().includes(q.toLowerCase())
      && (!kAlm||r.alm===kAlm) && (!kTipo||r.tipo===kTipo);
  });
  const act=KARDEX.filter(r=>!r.anulado);
  $('#view').innerHTML=`
    <div class="dx-ui-summary">
      <div class="dx-ui-chip"><b>${act.length}</b><span>Movimientos</span></div>
      <div class="dx-ui-chip"><b>${act.filter(r=>r.tipo==='ent').length}</b><span>Entradas</span></div>
      <div class="dx-ui-chip"><b>${act.filter(r=>r.tipo==='sal').length}</b><span>Salidas</span></div>
      <div class="dx-ui-chip"><b>${act.filter(r=>r.tipo==='tin'||r.tipo==='tout').length}</b><span>Transferencias</span></div>
    </div>
    <div class="dx-ui-card">
      <div class="dx-ui-toolbar"><h2>Movimientos</h2><span class="dx-ui-count">${f.length} resultado(s)</span>
        <label class="dx-ui-search">${ICON_SEARCH}<input id="q" value="${esc(q)}" placeholder="Buscar por material, código o referencia" aria-label="Buscar movimiento"></label></div>
      <div class="dx-stk-filters">${selAlm('kAlm',kAlm)}${selTipo('kTipo',kTipo)}</div>
      <div class="dx-ui-head dx-stk-kcols" aria-hidden="true"><span>Fecha</span><span>Material</span><span>Tipo</span><span style="text-align:right">Cant.</span><span style="text-align:right">Costo unit.</span><span style="text-align:right">Saldo</span><span></span></div>
      ${f.map(r=>kRow(r,true)).join('') || '<div class="dx-ui-empty">Sin movimientos para estos filtros.</div>'}
    </div>`;
  $('#q').addEventListener('input',e=>{ q=e.target.value; renderKardex(); keepSearch(); });
  $('#kAlm').addEventListener('change',e=>{ kAlm=e.target.value; renderKardex(); });
  $('#kTipo').addEventListener('change',e=>{ kTipo=e.target.value; renderKardex(); });
  bindOpen('[data-mat]', r=>{ matSel=r.dataset.mat; fTipo=''; render(); window.scrollTo(0,0); });
}

function renderDetalle(){
  const m=MATS.find(x=>x.id===matSel), c=calc(m);
  $('#pageTitle').textContent=m.nombre;
  $('#pageSub').textContent=m.cod+' · '+m.cat;
  $('#pageActions').innerHTML='';
  const ks=KARDEX.filter(r=>r.mat===m.id && (!fTipo||r.tipo===fTipo));
  const ws=m.stock.map(x=>`
    <div class="dx-ui-row dx-stk-wcols">
      <div class="dx-stk-main"><span><b>${UB[x.ubi].n}</b><small>${almNom(x.alm)}</small></span></div>
      <span>${UB[x.ubi].uso==='almacenaje'?'<span class="dx-ui-pill is-gray"><i></i>Almacenaje</span>':'<span class="dx-ui-pill is-amber"><i></i>'+USO[UB[x.ubi].uso]+'</span>'}</span>
      <div class="dx-stk-n" style="text-align:left"><span class="dx-stk-lbl">Lote</span>${x.lote}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Físico</span>${int(x.fis)}</div>
      <div class="dx-stk-n"><span class="dx-stk-lbl">Reservado</span>${int(x.res)}</div>
    </div>`).join('');
  $('#view').innerHTML=`
    <button class="dx-stk-back" id="back" aria-label="Volver al listado">← Volver a ${view==='kardex'?'Kardex':'Stock'}</button>
    <div class="dx-ui-summary">
      <div class="dx-ui-chip"><b>${int(c.fis)}</b><span>Físico (${m.und})</span></div>
      <div class="dx-ui-chip"><b>${int(c.res)}</b><span>Reservado</span></div>
      <div class="dx-ui-chip dx-stk-chip-warn"><b>${int(c.cua)}</b><span>En cuarentena o merma</span></div>
      <div class="dx-ui-chip dx-stk-chip-hl"><b>${int(c.disp)}</b><span>Disponible</span></div>
    </div>
    <div class="dx-ui-card">
      <div class="dx-stk-meta">
        <div><small>Costo promedio</small><span>${money(m.cp)}</span></div>
        <div><small>Valor en inventario</small><span>${money(c.val)}</span></div>
        <div><small>Control</small><span>${m.ctl}</span></div>
        <div><small>Alerta de reposición</small><span>${m.reorden+m.seg} ${m.und} <em style="font-style:normal;color:var(--dx-ui-gray);font-weight:500;font-size:12px">(reorden ${m.reorden} + seguridad ${m.seg})</em></span></div>
      </div>
      <div class="dx-ui-toolbar"><h2>Dónde está</h2><span class="dx-ui-count">${m.stock.length} ubicación(es)</span></div>
      <div class="dx-ui-head dx-stk-wcols" aria-hidden="true"><span>Ubicación</span><span>Uso</span><span>Lote</span><span style="text-align:right">Físico</span><span style="text-align:right">Reservado</span></div>
      ${ws || '<div class="dx-ui-empty">Sin existencias en ningún almacén.</div>'}
    </div>
    <div class="dx-ui-card">
      <div class="dx-ui-toolbar"><h2>Kardex del material</h2><span class="dx-ui-count">${ks.length} movimiento(s)</span>${selTipo('fTipo',fTipo)}</div>
      <div class="dx-ui-head dx-stk-dcols" aria-hidden="true"><span>Fecha</span><span>Tipo</span><span>Detalle</span><span style="text-align:right">Cant.</span><span style="text-align:right">Costo unit.</span><span style="text-align:right">Saldo</span></div>
      ${ks.map(r=>kRow(r,false)).join('') || '<div class="dx-ui-empty">Sin movimientos de este tipo.</div>'}
    </div>`;
  $('#back').addEventListener('click',()=>{ matSel=null; render(); });
  $('#fTipo').addEventListener('change',e=>{ fTipo=e.target.value; renderDetalle(); });
}

document.querySelectorAll('#tabs .dx-ui-tab').forEach(t=>t.addEventListener('click',()=>{ view=t.dataset.view; matSel=null; q=''; render(); }));
$('#themeBtn').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
  $('#themeBtn').textContent = d?'Modo oscuro':'Modo claro';
};
render();
</script>
</body>
</html>
