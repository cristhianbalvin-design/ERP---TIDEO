function setScreen(v){screen=v;render()}
function render(){if(screen==='detail')renderDetail();else if(screen==='kardex')renderKardex();else renderList()}
function renderList(){selected=null;$('#pageTitle').textContent='Reserva de Repuestos';$('#pageSub').textContent='Órdenes de trabajo con repuestos reservados para entrega interna a taller.';$('#pageActions').innerHTML=`<button class="dx-btn" id="emptyToggle">${forceEmpty?'Mostrar OT de ejemplo':'Simular lista vacía'}</button><button class="dx-btn" id="loadingToggle">Simular carga</button><button class="dx-btn" id="kardexBtn">Ver Kardex</button>`;const all=OTS,total=all.reduce((a,o)=>a+totals(o).reserved,0),pending=all.filter(o=>o.lines.some(l=>l.reserved-l.dispatched-l.released>0)).length;let filtered=all.filter(o=>(o.id+o.status+o.lines.map(l=>l.name+l.code).join(' ')).toLowerCase().includes(query.toLowerCase()));let body=loading?'<div class="dx-ui-empty" role="status">Cargando reservas…</div>':forceEmpty?'<div class="dx-ui-empty">No hay órdenes de trabajo con reservas pendientes.</div>':filtered.length?filtered.map(o=>{let t=totals(o),sum=o.lines.map(l=>lineState(l)[0]);let state=sum.includes('Reservado parcial + SOLPE')?['Reservado parcial + SOLPE','is-amber']:sum.every(x=>x==='Despachado')?['Despachado','is-green']:sum.some(x=>x==='Despachado parcial')?['Despachado parcial','is-cyan']:o.lines.some(l=>l.estimate>l.reserved)?['Reserva pendiente','is-amber']:['Reservado','is-green'];return `<div class="dx-ui-row dx-desp-cols" role="button" tabindex="0" data-ot="${o.id}" aria-label="Abrir orden ${o.id}"><div class="dx-desp-ot"><b>${o.id}</b><small>${o.status} · Empresa PRUEBA</small></div><span>${PILL(state[0],state[1])}</span><div class="dx-desp-num">${t.lines} ${t.lines===1?'l\u00ednea':'l\u00edneas'}</div><div class="dx-desp-num">${esc(quantitySummary(o))}</div><div class="dx-desp-num">${o.lines.length} ${o.lines.length===1?'material':'materiales'}</div><span class="dx-ui-arrow" aria-hidden="true">›</span></div>`}).join(''):'<div class="dx-ui-empty">No hay resultados para esa búsqueda.</div>';$('#view').innerHTML=`<div class="dx-ui-summary"><div class="dx-ui-chip"><b>${all.length}</b><span>OT con reserva</span></div><div class="dx-ui-chip"><b>${pending}</b><span>Con cantidad pendiente</span></div><div class="dx-ui-chip"><b>${total}</b><span>Unidades reservadas</span></div></div><div class="dx-desp-access"><strong>Permisos simulados:</strong> ${profile==='none'?'sin permisos de despacho ni liberación':profile==='dispatch'?'despachar':'despachar y liberar'}. La vista de detalle sigue disponible.</div><div class="dx-ui-card"><div class="dx-ui-toolbar"><h2>Órdenes de trabajo</h2><span class="dx-ui-count">${forceEmpty?0:filtered.length} OT</span><label class="dx-ui-search" aria-label="Buscar orden o material"><span aria-hidden="true">⌕</span><input id="q" placeholder="Buscar OT, material o código" value="${esc(query)}" aria-label="Buscar OT, material o código"></label></div><div class="dx-ui-head dx-desp-cols" aria-hidden="true"><span>Orden de trabajo</span><span>Estado</span><span>Líneas</span><span>Reservado / estimado</span><span>Materiales</span><span></span></div>${body}</div>`;$('#q').oninput=e=>{query=e.target.value;renderList();$('#q').focus()};$('#emptyToggle').onclick=()=>{forceEmpty=!forceEmpty;renderList()};$('#loadingToggle').onclick=()=>{loading=true;renderList();setTimeout(()=>{loading=false;renderList()},900)};$('#kardexBtn').onclick=()=>setScreen('kardex');document.querySelectorAll('[data-ot]').forEach(n=>{const open=()=>{selected=OTS.find(o=>o.id===n.dataset.ot);setScreen('detail')};n.onclick=open;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function actionButtons(l,i){let pending=Math.max(0,l.reserved-l.dispatched-l.released),out='';if(profile==='none')return '<span class="dx-desp-origin">Acciones ocultas · perfil sin permisos</span>';if(profile==='dispatch')return pending>0?`<button class="dx-btn primary" data-action="dispatch" data-line="${i}">Despachar</button>`:'<span class="dx-desp-origin">Sin cantidad pendiente</span>';if(pending>0)out+=`<button class="dx-btn primary" data-action="dispatch" data-line="${i}">Despachar</button>`;else if(l.solpe)out+=`<button class="dx-btn primary" disabled title="No hay stock reservado para despachar" aria-label="Despachar deshabilitado: no hay stock reservado">Despachar</button><small class="dx-desp-disabled-reason">Sin stock reservado</small>`;if(pending>0)out+=`<button class="dx-btn" data-action="release" data-line="${i}">Liberar</button>`;return out||'<span class="dx-desp-origin">Sin cantidad pendiente</span>'}
function renderDetail(){const o=selected;if(!o){setScreen('list');return}$('#pageTitle').textContent=o.id;$('#pageSub').textContent='Reserva de repuestos · Programada · Almacén Principal';$('#pageActions').innerHTML=`<button class="dx-btn" id="backList">Volver a OT</button><button class="dx-btn" id="kardexBtn">Ver Kardex</button>`;const t=totals(o),dis=o.lines.reduce((a,l)=>a+l.dispatched,0),rel=o.lines.reduce((a,l)=>a+l.released,0);const lines=o.lines.map((l,i)=>{let pending=Math.max(0,l.reserved-l.dispatched-l.released),st=lineState(l);return `<div class="dx-ui-row dx-desp-linecols dx-desp-line"><div class="dx-desp-material"><b>${esc(l.name)}</b><small>${l.code} · ${esc(l.unit)} · ${l.loc==='—'?'sin ubicación (sin stock reservado)':esc(l.loc)}</small></div><div class="dx-desp-n"><small>Estimado</small>${l.estimate} ${esc(l.unit)}</div><div class="dx-desp-n"><small>Reservado</small>${l.reserved} ${esc(l.unit)}</div><div class="dx-desp-n"><small>Despachado</small>${l.dispatched} ${esc(l.unit)}</div><div class="dx-desp-n"><small>Pendiente</small>${pending} ${esc(l.unit)}</div><span class="dx-desp-state">${PILL(st[0],st[1])}</span><div class="dx-desp-actions">${l.solpe&&l.reserved===0?'<span class="dx-desp-warn">SOLPE en curso</span>':''}${actionButtons(l,i)}</div></div>`}).join('');$('#view').innerHTML=`<button class="dx-desp-back" id="backDetail">← Volver a la lista</button><div class="dx-ui-summary"><div class="dx-ui-chip"><b>${o.lines.length}</b><span>${o.lines.length===1?'L\u00ednea':'L\u00edneas'}</span></div><div class="dx-ui-chip"><b>${t.reserved}</b><span>Reservado (${esc(o.lines[0].unit)})</span></div><div class="dx-ui-chip"><b>${dis}</b><span>Despachado</span></div><div class="dx-ui-chip"><b>${rel}</b><span>Liberado</span></div></div><div class="dx-desp-notice">Al cerrar técnicamente la OT, el consumo heredado solo descontará lo que todavía no se haya despachado a taller.</div><div class="dx-ui-card"><div class="dx-ui-toolbar"><h2>Repuestos reservados</h2><span class="dx-ui-count">${o.lines.length} ${o.lines.length===1?'l\u00ednea':'l\u00edneas'} &middot; ${PILL(o.status,'is-cyan')}</span></div><div class="dx-ui-head dx-desp-linecols" aria-hidden="true"><span>Material</span><span>Estimado</span><span>Reservado</span><span>Despachado</span><span>Pendiente</span><span>Estado</span><span>Acciones</span></div>${lines}</div>`;$('#backList').onclick=()=>{selected=null;setScreen('list')};$('#backDetail').onclick=()=>{selected=null;setScreen('list')};$('#kardexBtn').onclick=()=>setScreen('kardex');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openPanel(b.dataset.action,+b.dataset.line))}
function renderKardex(){selected=selected||OTS[0];$('#pageTitle').textContent='Kardex · Despachos a taller';$('#pageSub').textContent='Ejemplo de salida interna generada desde la reserva de la OT.';$('#pageActions').innerHTML='<button class="dx-btn" id="backList">Volver a OT</button>';const rows=ledger.map(k=>`<div class="dx-ui-row dx-desp-kcols"><span>${k.date}</span><div class="dx-desp-material"><b>Despacho a taller</b><small>${esc(k.code)} · ${esc(k.material)} · salida</small></div><span>${PILL('despacho_taller','is-cyan')}</span><span class="dx-desp-qty">−${k.qty} ${esc(k.unit)}</span><span>${k.ot}</span></div>`).join('');$('#view').innerHTML=`<div class="dx-desp-notice">El asiento de salida se muestra como referencia. No se anula desde Kardex: <strong>Se corrige desde la OT</strong>.</div><div class="dx-ui-card"><div class="dx-ui-toolbar"><h2>Movimientos de reserva</h2><span class="dx-ui-count">${ledger.length} ${ledger.length===1?'asiento':'asientos'}</span></div><div class="dx-ui-head dx-desp-kcols" aria-hidden="true"><span>Fecha</span><span>Movimiento</span><span>Motivo</span><span>Cantidad</span><span>Referencia</span></div>${rows||'<div class="dx-ui-empty">Aún no hay despachos. Registra uno desde el detalle de la OT para verlo aquí.</div>'}</div>`;$('#backList').onclick=()=>setScreen(selected?'detail':'list')}
function openPanel(mode,index){if(profile==='none'||(mode==='release'&&profile!=='both'))return;activePanel={mode,index};simulateRace=false;const o=selected,l=o.lines[index],remaining=Math.max(0,l.reserved-l.dispatched-l.released);$('#backdrop').hidden=false;$('#panel').hidden=false;renderPanel();$('#panel').querySelector('input,select,button')?.focus()}
function renderPanel(error=''){const {mode,index}=activePanel,o=selected,l=o.lines[index],remaining=Math.max(0,l.reserved-l.dispatched-l.released),isDispatch=mode==='dispatch';const title=isDispatch?'Despachar a taller':'Liberar reserva';let form='';if(isDispatch){form=`<div class="dx-desp-formline"><div class="dx-desp-formlinehead"><b>${esc(l.name)} · ${l.code}</b>${PILL(`${remaining} ${esc(l.unit)} pendiente`,'is-cyan')}</div><div class="dx-desp-formcols"><div class="dx-desp-field"><label for="qty">Cantidad a despachar (${esc(l.unit)})</label><input class="dx-desp-control" id="qty" type="number" min="0" step="any" value="${remaining}" max="${remaining}"><small>Máximo: ${remaining} ${esc(l.unit)} reservados pendientes.</small></div><div class="dx-desp-field"><label>Ubicación de origen</label><input class="dx-desp-control" value="${esc(l.loc)}" readonly></div></div></div><div class="dx-desp-formcols"><div class="dx-desp-field"><label for="receive">Recibe en taller · opcional</label><input class="dx-desp-control" id="receive" placeholder="Nombre de quien recibe"></div><div class="dx-desp-field"><label for="obs">Observación</label><textarea class="dx-desp-control" id="obs" placeholder="Nota para la entrega"></textarea></div></div><div class="dx-desp-field" style="margin-top:12px"><label><input id="race" type="checkbox"> Simular error: la reserva cambió en el servidor</label></div>`}else{form=`<div class="dx-desp-formline"><div class="dx-desp-formlinehead"><b>${esc(l.name)} · ${l.code}</b>${PILL(`${remaining} ${esc(l.unit)} pendiente`,'is-cyan')}</div><div class="dx-desp-formcols"><div class="dx-desp-field"><label for="qty">Cantidad a liberar (${esc(l.unit)})</label><input class="dx-desp-control" id="qty" type="number" min="0" step="any" value="${remaining}" max="${remaining}"></div><div class="dx-desp-field"><label for="reason">Motivo obligatorio</label><select id="reason" class="dx-desp-control"><option value="">Selecciona un motivo</option><option>Reprogramación de la OT</option><option>Repuesto ya no requerido</option><option>Error de reserva</option><option value="Otro">Otro</option></select></div></div><div class="dx-desp-field" id="otherWrap" hidden style="margin-top:12px"><label for="other">Especifica el motivo</label><input id="other" class="dx-desp-control" placeholder="Motivo de liberación"></div></div><div class="dx-desp-warn">La cantidad liberada vuelve a Disponible. Esta acción no genera movimiento de kardex.</div><div class="dx-desp-field" style="margin-top:12px"><label><input id="race" type="checkbox"> Simular error: la reserva cambió en el servidor</label></div>`}$('#panel').innerHTML=`<header><h2 id="panelTitle">${title} · ${o.id}</h2><button class="dx-desp-close" id="close" aria-label="Cerrar panel">×</button></header><div class="dx-desp-panelbody"><div id="panelError">${error?`<div class="dx-desp-warn" role="alert">${error}</div>`:''}</div>${form}<div class="dx-desp-sum" aria-live="polite"><small>Resumen en vivo</small><div><span>${isDispatch?'Saldrá de':'Se liberará de'}</span><b>${esc(l.loc)}</b></div><div><span>Cantidad</span><b id="sumQty">—</b></div><div><span>Después de esta acción, quedará pendiente</span><b id="sumRemain">—</b></div></div></div><footer><button class="dx-btn" id="cancel">Cancelar</button><button class="dx-btn ${isDispatch?'primary':'danger'}" id="submit" disabled>${title}</button></footer>`;const qty=$('#qty'),reason=$('#reason'),other=$('#other');function update(){let q=Number(qty.value),valid=Number.isFinite(q)&&q>0&&q<=remaining&&(!reason||reason.value!==''&&(reason.value!=='Otro'||other.value.trim()!==''));$('#sumQty').textContent=q>0?`${q} ${l.unit}`:'—';$('#sumRemain').textContent=q>0?`${Math.max(0,remaining-q)} ${l.unit}`:'—';$('#submit').disabled=!valid;qty.setAttribute('aria-invalid',String(!(q>0&&q<=remaining)));}qty.oninput=update;reason?.addEventListener('change',()=>{$('#otherWrap').hidden=reason.value!=='Otro';update()});other?.addEventListener('input',update);$('#race').onchange=e=>simulateRace=e.target.checked;$('#close').onclick=closePanel;$('#cancel').onclick=closePanel;$('#submit').onclick=submitPanel;update()}
function submitPanel(){const {mode,index}=activePanel,o=selected,l=o.lines[index],q=Number($('#qty').value),remaining=Math.max(0,l.reserved-l.dispatched-l.released);if(!(q>0&&q<=remaining))return;const isDispatch=mode==='dispatch',reason=$('#reason')?.value,other=$('#other')?.value.trim();if(!isDispatch&&(!reason||reason==='Otro'&&!other)){renderPanel('Indica un motivo para liberar.');return}if(simulateRace){$('#panelError').innerHTML='<div class=dx-desp-warn role=alert>Error del servidor: la reserva cambió antes de guardar. No se aplicó ningún cambio. Actualiza el detalle de la OT e intenta de nuevo.</div>';return}if(isDispatch){l.dispatched+=q;ledger.push({date:new Date().toISOString().slice(0,10),ot:o.id,code:l.code,material:l.name,qty:q,unit:l.unit});toast(`Despacho registrado: ${q} ${l.unit} · ${o.id}. Kardex actualizado.`)}else{l.released+=q;toast(`Reserva liberada: ${q} ${l.unit} · Motivo: ${reason==='Otro'?other:reason}. Disponible actualizado; sin asiento de kardex.`)}closePanel();renderDetail()}
function closePanel(){$('#panel').hidden=true;$('#backdrop').hidden=true;activePanel=null}
$('#profile').onchange=e=>{profile=e.target.value;render()};$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('#themeBtn').textContent=dark?'Modo oscuro':'Modo claro'};render();
</script></body></html>
