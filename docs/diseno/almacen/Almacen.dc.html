<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Almacén WMS — Fase 1 (Recepción de OC + Ubicaciones, alta/edición)</title>
<style>
/* Variables copiadas de zahory.css, sección DX-UI base */
.dx-ui{
  --dx-ui-navy:#1A2B4A; --dx-ui-cyan:#00ACC1; --dx-ui-cyan-fg:#0B4F5A; --dx-ui-violet:#5B3A8C;
  --dx-ui-gray:#6B7280; --dx-ui-line:#E4E7EB; --dx-ui-line-soft:#EEF0F3; --dx-ui-border:#C9CFD8;
  --dx-ui-bg:#F4F6F8; --dx-ui-head:#F8F9FA; --dx-ui-card:#FFFFFF; --dx-ui-ink:#1F2937;
  --dx-ui-hover:#F6FBFC; --dx-ui-cyan-bg:#E0F7FA; --dx-ui-violet-bg:#F0EAFB;
  --dx-ui-amber-bg:#FFF3E0; --dx-ui-amber-fg:#8A4B00; --dx-ui-amber-dot:#E08A00;
  --dx-ui-green-bg:#E3F6EA; --dx-ui-green-fg:#14633A;
  --dx-ui-red-bg:#FDE8E7; --dx-ui-red-fg:#9B2C2C; --dx-ui-red-dot:#DC2626;
  --dx-ui-gray-bg:#F1F3F5; --dx-ui-gray-fg:#4B5563; --dx-ui-gray-dot:#6B7280;
  width:100%; margin-bottom:18px; color:var(--dx-ui-ink); font:14px/1.4 'DM Sans',system-ui,sans-serif;
}
[data-theme='dark'] .dx-ui{
  --dx-ui-navy:#F8FAFC; --dx-ui-cyan:#22D3EE; --dx-ui-cyan-fg:#67E8F9; --dx-ui-violet:#D8B4FE;
  --dx-ui-gray:#94A3B8; --dx-ui-line:rgba(255,255,255,.1); --dx-ui-line-soft:rgba(255,255,255,.08); --dx-ui-border:#475569;
  --dx-ui-bg:#020617; --dx-ui-head:#0F172A; --dx-ui-card:#1E293B; --dx-ui-ink:#F8FAFC;
  --dx-ui-hover:#172033; --dx-ui-cyan-bg:#0A3038; --dx-ui-violet-bg:#321B3B;
  --dx-ui-amber-bg:#3A2810; --dx-ui-amber-fg:#FDBA74; --dx-ui-amber-dot:#F59E0B;
  --dx-ui-green-bg:#12351F; --dx-ui-green-fg:#86EFAC;
  --dx-ui-red-bg:#3B1D20; --dx-ui-red-fg:#FCA5A5; --dx-ui-red-dot:#F87171;
  --dx-ui-gray-bg:#273244; --dx-ui-gray-fg:#CBD5E1; --dx-ui-gray-dot:#94A3B8;
}
*{box-sizing:border-box}
body{margin:0;background:#F4F6F8;font-family:'DM Sans',system-ui,sans-serif}
[data-theme='dark'] body{background:#020617}
.mock-shell{display:flex;min-height:100vh}
.mock-side{width:240px;flex:none;background:#1A2B4A;color:#fff;padding:18px 14px}
.mock-side b{display:block;font:700 15px 'Sora',sans-serif;margin-bottom:16px}
.mock-side span{display:block;padding:9px 10px;border-radius:8px;font-size:13px;color:#C7D2E4}
.mock-side span.on{background:rgba(255,255,255,.12);color:#fff}
.mock-side small{display:block;margin:14px 10px 6px;font-size:10px;letter-spacing:.08em;color:#8FA2C0}
.mock-main{flex:1;min-width:0;padding:24px 28px}
@media (max-width:900px){.mock-side{display:none}.mock-main{padding:16px}}

.dx-ui-head-page{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dx-ui-eyebrow{color:var(--dx-ui-cyan);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dx-ui-title{margin:2px 0 0;color:var(--dx-ui-navy);font:700 24px/1.2 'Sora',sans-serif}
.dx-ui-sub{margin:4px 0 0;color:var(--dx-ui-gray)}
.dx-ui-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dx-btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--dx-ui-border);background:var(--dx-ui-card);color:var(--dx-ui-navy);font:600 14px 'DM Sans',sans-serif;cursor:pointer}
.dx-btn.primary{background:var(--dx-ui-navy);color:var(--dx-ui-card);border-color:var(--dx-ui-navy)}
[data-theme='dark'] .dx-btn.primary{color:#0F172A}
.dx-btn:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-btn[disabled]{background:var(--dx-ui-gray-bg);color:var(--dx-ui-gray-fg);border-color:var(--dx-ui-line);cursor:not-allowed}

.dx-ui-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.dx-ui-tab{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--dx-ui-line);background:var(--dx-ui-card);color:var(--dx-ui-gray);font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.dx-ui-tab.on{background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg);border-color:transparent}

/* Base compartida (copia de zahory.css) */
.dx-ui-summary { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.dx-ui-chip { display:flex; align-items:baseline; gap:8px; padding:8px 16px; border:1px solid var(--dx-ui-line); border-radius:10px; background:var(--dx-ui-card); }
.dx-ui-chip b { color:var(--dx-ui-navy); font:700 20px 'Sora',sans-serif; }
.dx-ui-chip span { color:var(--dx-ui-gray); font-size:12px; }
.dx-ui-card { container-type:inline-size; overflow:hidden; width:100%; border:1px solid var(--dx-ui-line); border-radius:14px; background:var(--dx-ui-card); box-shadow:0 1px 2px rgba(15,27,48,.04); margin-bottom:16px; }
.dx-ui-toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--dx-ui-line); }
.dx-ui-toolbar h2 { margin:0 auto 0 0; color:var(--dx-ui-navy); font:700 16px/1.4 'Sora',sans-serif; }
.dx-ui-count { color:var(--dx-ui-gray); font-size:12px; white-space:nowrap; }
.dx-ui-search { display:flex; align-items:center; gap:8px; width:340px; max-width:100%; height:40px; padding:0 12px; border:1px solid var(--dx-ui-border); border-radius:8px; background:var(--dx-ui-card); color:var(--dx-ui-gray); }
.dx-ui-search:focus-within { border-color:var(--dx-ui-cyan); box-shadow:0 0 0 3px color-mix(in srgb,var(--dx-ui-cyan) 15%,transparent); }
.dx-ui-search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--dx-ui-ink); font:14px 'DM Sans',sans-serif; }
.dx-ui-head,.dx-ui-row { display:grid; grid-template-columns:var(--dx-ui-cols,minmax(0,1fr)); column-gap:16px; align-items:center; padding-inline:20px; }
.dx-ui-head { min-height:38px; border-bottom:1px solid var(--dx-ui-line); background:var(--dx-ui-head); color:var(--dx-ui-gray); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.dx-ui-row { min-height:68px; border-bottom:1px solid var(--dx-ui-line-soft); cursor:pointer; transition:background .12s; }
.dx-ui-row:last-child { border-bottom:0; }
.dx-ui-row:hover { background:var(--dx-ui-hover); }
.dx-ui-row:hover .dx-ui-arrow { color:var(--dx-ui-navy); transform:translateX(2px); }
.dx-ui-row:focus-visible { position:relative; z-index:1; outline:2px solid var(--dx-ui-cyan); outline-offset:-2px; }
.dx-ui-icon { display:flex; flex:none; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; }
.dx-ui-icon.is-cyan { background:var(--dx-ui-cyan-bg); color:var(--dx-ui-cyan-fg); }
.dx-ui-icon.is-violet { background:var(--dx-ui-violet-bg); color:var(--dx-ui-violet); }
.dx-ui-pill { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
.dx-ui-pill i { width:6px; height:6px; flex:none; border-radius:50%; background:currentColor; }
.dx-ui-pill.is-amber { background:var(--dx-ui-amber-bg); color:var(--dx-ui-amber-fg); }
.dx-ui-pill.is-amber i { background:var(--dx-ui-amber-dot); }
.dx-ui-pill.is-green { background:var(--dx-ui-green-bg); color:var(--dx-ui-green-fg); }
.dx-ui-pill.is-red { background:var(--dx-ui-red-bg); color:var(--dx-ui-red-fg); }
.dx-ui-pill.is-red i { background:var(--dx-ui-red-dot); }
.dx-ui-pill.is-gray { background:var(--dx-ui-gray-bg); color:var(--dx-ui-gray-fg); }
.dx-ui-pill.is-gray i { background:var(--dx-ui-gray-dot); }
.dx-ui-pill.is-cyan { background:var(--dx-ui-cyan-bg); color:var(--dx-ui-cyan-fg); }
.dx-ui-arrow { color:#9AA3B2; transition:.12s; }
.dx-ui-empty { padding:48px 20px; color:var(--dx-ui-gray); text-align:center; }
@container (max-width:760px) {
  .dx-ui-head { display:none; }
  .dx-ui-row { row-gap:8px; padding:14px 16px; }
}

/* Reglas propias: Recepción de OC (dx-rec-) */
.dx-rec-cols { --dx-ui-cols:150px minmax(0,1fr) 130px 120px 130px 20px; }
.dx-rec-main{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dx-rec-main b{color:var(--dx-ui-navy);font-weight:600}
.dx-rec-main small{display:block;color:var(--dx-ui-gray);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.dx-rec-oc{display:flex;align-items:center;gap:10px;min-width:0;color:var(--dx-ui-navy);font-weight:600}
.dx-rec-prog{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dx-ui-gray)}
.dx-rec-bar{height:6px;border-radius:999px;background:var(--dx-ui-line)}
.dx-rec-bar i{display:block;height:100%;border-radius:999px;background:var(--dx-ui-cyan)}
@container (max-width:760px){
  .dx-rec-cols { --dx-ui-cols:minmax(0,1fr) auto; }
  .dx-rec-cols > :nth-child(3), .dx-rec-cols > :nth-child(4){display:none}
  .dx-rec-cols > .dx-ui-arrow{display:none}
}
.dx-rec-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;color:var(--dx-ui-cyan-fg);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;font-size:14px}
.dx-rec-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:16px 20px;border-bottom:1px solid var(--dx-ui-line)}
.dx-rec-meta div small{display:block;color:var(--dx-ui-gray);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-rec-meta div span{display:block;margin-top:2px;color:var(--dx-ui-navy);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-width:760px){.dx-rec-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dx-rec-line-cols { --dx-ui-cols:minmax(0,1fr) 84px 84px 120px 210px 36px; cursor:default; }
.dx-rec-line-cols.dx-ui-row{cursor:default}
.dx-rec-line-cols.dx-ui-row:hover{background:transparent}
.dx-rec-line-cols .num{display:block;font:600 14px 'Sora',sans-serif;color:var(--dx-ui-navy);text-align:right}
@container (max-width:760px){.dx-rec-line-cols .num{text-align:left}.dx-rec-line-cols .dx-rec-obs{grid-column:1 / -1;justify-self:end}}
.dx-rec-field{width:100%;height:40px;padding:0 10px;border:1px solid var(--dx-ui-border);border-radius:8px;background:var(--dx-ui-card);color:var(--dx-ui-ink);font:14px 'DM Sans',sans-serif}
.dx-rec-field:focus{outline:0;border-color:var(--dx-ui-cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--dx-ui-cyan) 15%,transparent)}
.dx-rec-field.is-bad{border-color:var(--dx-ui-red-dot)}
.dx-rec-lbl{display:none;color:var(--dx-ui-gray);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-rec-obs{height:36px;width:36px;border-radius:8px;border:1px solid var(--dx-ui-border);background:var(--dx-ui-card);color:var(--dx-ui-gray);cursor:pointer;font-size:16px}
.dx-rec-obs.on{background:var(--dx-ui-amber-bg);color:var(--dx-ui-amber-fg);border-color:var(--dx-ui-amber-dot)}
@container (max-width:760px){
  .dx-rec-line-cols { --dx-ui-cols:1fr 1fr; }
  .dx-rec-line-cols > :first-child{grid-column:1 / -1}
  .dx-rec-lbl{display:block}
}
.dx-rec-3v{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--dx-ui-line);background:var(--dx-ui-head)}
.dx-rec-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--dx-ui-line)}
.dx-rec-foot .msg{margin-right:auto;color:var(--dx-ui-gray);font-size:13px}
.dx-rec-note{padding:12px 20px;border-top:1px solid var(--dx-ui-line);background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg);font-size:13px}

/* Reglas propias: Ubicaciones (dx-ubi-) */
.dx-ubi-wh{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--dx-ui-line)}
.dx-ubi-cols { --dx-ui-cols:minmax(0,1fr) 110px 110px 120px 20px; }
.dx-ubi-name{padding-left:calc(var(--n,0)*22px);display:flex;align-items:center;gap:10px;min-width:0;color:var(--dx-ui-navy);font-weight:600;overflow:hidden;white-space:nowrap}
.dx-ubi-name small{color:var(--dx-ui-gray);font-weight:500}
.dx-ubi-name em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.dx-ubi-ind{flex:none}
.dx-ubi-num{font:600 14px 'Sora',sans-serif;color:var(--dx-ui-navy)}
.dx-ubi-mob{display:none}
.dx-ubi-mob small{font:12px 'DM Sans',system-ui,sans-serif;color:var(--dx-ui-gray)}
@container (max-width:760px){
  .dx-ubi-cols { --dx-ui-cols:minmax(0,1fr) auto; }
  .dx-ubi-cols > :nth-child(2), .dx-ubi-cols > :nth-child(3), .dx-ubi-cols > :nth-child(4){display:none}
  .dx-ubi-name{padding-left:calc(var(--n,0)*10px)}
  .dx-ubi-cols > .dx-ubi-mob{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .dx-ubi-cols > .dx-ui-arrow{display:none}
}
/* B2b: alta, edición, desactivación y detalle (dx-ubi-) */
.dx-btn.danger{color:var(--dx-ui-red-fg);border-color:var(--dx-ui-red-dot);background:var(--dx-ui-card)}
.dx-btn.danger[disabled]{color:var(--dx-ui-gray-fg);border-color:var(--dx-ui-line);background:var(--dx-ui-gray-bg)}
.dx-btn:not(.primary):not(.danger):hover{background:var(--dx-ui-hover)}
.dx-ubi-cols.is-off{opacity:.62}
.dx-ubi-switch{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--dx-ui-line);background:var(--dx-ui-card);color:var(--dx-ui-gray);font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.dx-ubi-switch.on{background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg);border-color:transparent}
.dx-ubi-switch[disabled]{opacity:.5;cursor:not-allowed}
.dx-ubi-switch:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-ubi-usofil{width:auto;height:36px;min-width:170px;border-radius:999px;font-size:13px}
.dx-ubi-toast{margin-bottom:12px;padding:10px 16px;border-radius:10px;background:var(--dx-ui-green-bg);color:var(--dx-ui-green-fg);font-weight:600;font-size:13px}
.dx-ubi-det-cols{--dx-ui-cols:minmax(0,1fr) 120px 110px;cursor:default}
.dx-ubi-det-cols.dx-ui-row{cursor:default}
.dx-ubi-det-cols.dx-ui-row:hover{background:transparent}
.dx-ubi-subhead{padding:12px 20px;border-top:1px solid var(--dx-ui-line);background:var(--dx-ui-head);color:var(--dx-ui-gray);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-ubi-sub{display:flex;align-items:center;gap:12px;min-height:56px}
.dx-ubi-sub .dx-ubi-name{flex:1;padding-left:0}
.dx-ubi-overlay{position:fixed;inset:0;z-index:20;background:rgba(15,27,48,.45)}
.dx-ubi-panel{position:fixed;top:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;width:min(440px,100vw);background:var(--dx-ui-card);box-shadow:-8px 0 30px rgba(15,27,48,.25);color:var(--dx-ui-ink)}
.dx-ubi-panel header,.dx-ubi-panel footer{display:flex;align-items:center;gap:10px;padding:16px 20px}
.dx-ubi-panel header{border-bottom:1px solid var(--dx-ui-line)}
.dx-ubi-panel header h2{margin:0 auto 0 0;color:var(--dx-ui-navy);font:700 18px 'Sora',sans-serif}
.dx-ubi-panel footer{justify-content:flex-end;border-top:1px solid var(--dx-ui-line)}
.dx-ubi-x{width:36px;height:36px;border-radius:8px;border:1px solid var(--dx-ui-border);background:var(--dx-ui-card);color:var(--dx-ui-gray);font-size:20px;cursor:pointer}
.dx-ubi-x:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-ubi-body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.dx-ubi-f label{display:block;margin-bottom:6px;color:var(--dx-ui-gray);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-ubi-f small{display:block;margin-top:6px;color:var(--dx-ui-gray);font-size:12px}
.dx-ubi-f small.bad{color:var(--dx-ui-red-fg)}
.dx-ubi-ro{padding:10px 12px;border-radius:8px;background:var(--dx-ui-gray-bg);color:var(--dx-ui-navy);font-weight:600}
.dx-ubi-seg{display:flex;gap:6px}
.dx-ubi-seg button{flex:1;height:40px;border-radius:8px;border:1px solid var(--dx-ui-border);background:var(--dx-ui-card);color:var(--dx-ui-gray);font:600 14px 'DM Sans',sans-serif;cursor:pointer}
.dx-ubi-seg button.on{background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg);border-color:var(--dx-ui-cyan)}
.dx-ubi-seg button:focus-visible{outline:2px solid var(--dx-ui-cyan);outline-offset:2px}
.dx-ubi-path{padding:12px 14px;border-radius:10px;background:var(--dx-ui-cyan-bg);color:var(--dx-ui-cyan-fg)}
.dx-ubi-path small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dx-ubi-path span{font-weight:600}
.dx-ubi-alert{padding:12px 14px;border-radius:10px;background:var(--dx-ui-red-bg);color:var(--dx-ui-red-fg);font-size:13px}
.dx-ubi-confirm{position:fixed;z-index:22;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));padding:22px;border-radius:14px;background:var(--dx-ui-card);box-shadow:0 12px 40px rgba(15,27,48,.35);color:var(--dx-ui-ink)}
.dx-ubi-confirm h2{margin:0 0 8px;color:var(--dx-ui-navy);font:700 17px 'Sora',sans-serif}
.dx-ubi-confirm p{margin:0 0 18px;color:var(--dx-ui-gray)}
.dx-ubi-confirm-f{display:flex;gap:10px;justify-content:flex-end}
@container (max-width:760px){
  .dx-ubi-det-cols{--dx-ui-cols:minmax(0,1fr) auto}
  .dx-ubi-det-cols > :nth-child(2){display:none}
}

.theme-toggle{position:fixed;right:14px;bottom:14px;z-index:5;height:40px;padding:0 14px;border-radius:999px;border:1px solid #C9CFD8;background:#fff;color:#1A2B4A;font:600 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="mock-shell">
  <aside class="mock-side">
    <b>TIDEO · Operaciones</b>
    <small>ALMACÉN</small>
    <span>Inventario &amp; Kardex</span>
    <span>Entradas &amp; Salidas</span>
    <span class="on" id="navRec">Recepciones</span>
    <span id="navUbi">Ubicaciones</span>
    <span>Reserva de Repuestos</span>
    <span>Stock Mínimos &amp; Alertas</span>
  </aside>
  <main class="mock-main">
    <section class="dx-ui dx-almacen" id="root">
      <div class="dx-ui-head-page">
        <div>
          <div class="dx-ui-eyebrow">Almacén · WMS</div>
          <h1 class="dx-ui-title" id="pageTitle">Recepciones de compra</h1>
          <p class="dx-ui-sub" id="pageSub">Registra el ingreso físico de las órdenes de compra a su ubicación.</p>
        </div>
        <div class="dx-ui-actions" id="pageActions"></div>
      </div>
      <div class="dx-ui-tabs" role="tablist">
        <button class="dx-ui-tab on" role="tab" data-view="rec">Recepción de OC</button>
        <button class="dx-ui-tab" role="tab" data-view="ubi">Ubicaciones</button>
      </div>
      <div id="view"></div>
    </section>
  </main>
</div>
<button class="theme-toggle" id="themeBtn" aria-label="Cambiar tema claro u oscuro">Modo oscuro</button>

<script>
/* Datos ilustrativos y genéricos (sin clientes reales) */
const ALMACENES = [
  {id:'ALM-001', nombre:'Almacén Central'},
  {id:'ALM-002', nombre:'Almacén Taller'}
];
const UBICACIONES = [

const OCS = [

function render(){
  document.querySelectorAll('.dx-ui-tab').forEach(t=>t.classList.toggle('on', t.dataset.view===view));
  $('#navRec').classList.toggle('on', view==='rec'); $('#navUbi').classList.toggle('on', view==='ubi');
  if(view==='ubi'){ renderUbi(); return; }
  if(ocSel) renderDetalle(); else renderLista();
}

  $('#pageTitle').textContent='Recepciones de compra';

      <span class="dx-rec-main"><b>${o.prov}</b><small>${o.lines.length} línea(s) · destino ${ALMACENES.find(a=>a.id===o.alm).nombre}</small></span>
      <div class="dx-rec-prog"><span>${o.pct}% recibido</span><div class="dx-rec-bar"><i style="width:${o.pct}%"></i></div></div>

      <span style="color:var(--dx-ui-gray);font-size:13px">${o.fecha}</span>

      <div class="dx-ui-head dx-rec-cols" aria-hidden="true"><span>OC</span><span>Proveedor</span><span>Avance</span><span>Estado</span><span>Emisión</span><span></span></div>

}

function renderDetalle(){
  const o = OCS.find(x=>x.id===ocSel);
  $('#pageTitle').textContent='Recepción '+o.id;
  $('#pageSub').textContent='Confirma cantidades y asigna la ubicación de cada línea.';
  $('#pageActions').innerHTML='';
  const done = confirmada[o.id];
  const rowsHtml = o.lines.map((l,i)=>{
    const k=o.id+'-'+i, pend=l.ped-l.rec;
    if(recQty[k]===undefined) recQty[k]=pend;
    if(recUbi[k]===undefined) recUbi[k]=l.ubi;
    const bad = recQty[k]<0 || recQty[k]>pend;
    return `<div class="dx-ui-row dx-rec-line-cols">
      <span class="dx-rec-main"><b>${l.mat}</b><small>${l.cod}</small></span>
      <span><span class="dx-rec-lbl">Pedido</span><span class="num">${l.ped}</span></span>
      <span><span class="dx-rec-lbl">Pendiente</span><span class="num">${pend}</span></span>
      <span><span class="dx-rec-lbl">A recibir</span><input class="dx-rec-field ${bad?'is-bad':''}" type="number" min="0" max="${pend}" value="${recQty[k]}" data-q="${k}" aria-label="Cantidad a recibir de ${l.mat}" ${done||pend===0?'disabled':''}></span>
      <span><span class="dx-rec-lbl">Ubicación destino</span><select class="dx-rec-field" data-u="${k}" aria-label="Ubicación destino de ${l.mat}" ${done||pend===0?'disabled':''}>${ubiOptions(o.alm, recUbi[k])}</select></span>
      <button class="dx-rec-obs ${obs[k]?'on':''}" data-o="${k}" aria-label="Marcar observación en ${l.mat}" title="Observar línea" ${done?'disabled':''}>!</button>
    </div>`;
  }).join('');
  const nObs = Object.keys(obs).filter(k=>k.startsWith(o.id)&&obs[k]).length;
  const algunaMala = o.lines.some((l,i)=>{const v=recQty[o.id+'-'+i];return v<0||v>l.ped-l.rec;});
  const totalRec = o.lines.reduce((s,l,i)=>s+(+recQty[o.id+'-'+i]||0),0);
  const estadoFinal = nObs>0 ? '<span class="dx-ui-pill is-amber"><i></i>Quedará observada</span>' : '<span class="dx-ui-pill is-green"><i></i>Quedará conforme</span>';
  $('#view').innerHTML=`
    <button class="dx-rec-back" id="back">← Volver a recepciones</button>
    <div class="dx-ui-card">
      <div class="dx-ui-toolbar"><h2>${o.id} · ${o.prov}</h2><span>${done?'<span class="dx-ui-pill is-green"><i></i>Recepción registrada</span>':pillEstado(o.estado)}</span></div>
      <div class="dx-rec-meta">
        <div><small>Almacén destino</small><span>${ALMACENES.find(a=>a.id===o.alm).nombre}</span></div>
        <div><small>Emisión</small><span>${o.fecha}</span></div>
        <div><small>Avance</small><span>${o.pct}% recibido</span></div>
        <div><small>Guía del proveedor</small><span>— sin registrar</span></div>
      </div>
      <div class="dx-ui-head dx-rec-line-cols" aria-hidden="true"><span>Material</span><span style="text-align:right">Pedido</span><span style="text-align:right">Pend.</span><span>A recibir</span><span>Ubicación destino</span><span></span></div>
      ${rowsHtml}
      <div class="dx-rec-3v">
        <span class="dx-ui-pill is-green"><i></i>Cantidades ≤ pendiente</span>
        <span class="dx-ui-pill ${algunaMala?'is-red':'is-green'}"><i></i>${algunaMala?'Cantidad fuera de rango':'Validación 3 vías de cantidad OK'}</span>
        <span class="dx-ui-pill is-gray"><i></i>Factura: se completa después en Administración</span>
      </div>
      <div class="dx-rec-note">Esta pantalla registra solo el ingreso <b>físico</b> (stock y kardex). La factura y la cuenta por pagar se completan desde Administración con "Completar factura".</div>
      <div class="dx-rec-foot">
        <span class="msg">${done?'Ingreso registrado en kardex.':`Total a recibir: <b>${totalRec}</b> unidad(es) · ${nObs} línea(s) observada(s)`}</span>
        ${done?'':estadoFinal}
        <button class="dx-btn" id="cancel">Cancelar</button>
        <button class="dx-btn primary" id="ok" ${done||algunaMala||totalRec===0?'disabled':''}>Registrar recepción</button>
      </div>
    </div>`;
  $('#back').onclick=()=>{ocSel=null;render();};
  $('#cancel').onclick=()=>{ocSel=null;render();};
  const ok=$('#ok'); if(ok) ok.onclick=()=>{confirmada[o.id]=true;render();};
  document.querySelectorAll('[data-q]').forEach(i=>i.addEventListener('input',e=>{recQty[e.target.dataset.q]=+e.target.value; const p=e.target.dataset.q; renderDetalle(); const n=document.querySelector('[data-q="'+p+'"]'); if(n){n.focus();}}));
  document.querySelectorAll('[data-u]').forEach(s=>s.addEventListener('change',e=>{recUbi[e.target.dataset.u]=e.target.value;}));
  document.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',e=>{const k=e.currentTarget.dataset.o;obs[k]=!obs[k];renderDetalle();}));
}

function renderUbi(){
  if(ubiSel){ renderUbiDetalle(); return; }
  $('#pageTitle').textContent='Ubicaciones';
  $('#pageSub').textContent='Zonas, racks y posiciones de cada almacén. Todo el stock vive en una ubicación.';
  $('#pageActions').innerHTML='<button class="dx-btn primary" id="nueva" aria-label="Nueva ubicación">+ Nueva ubicación</button>';
  $('#nueva').onclick=()=>abrirPanel({modo:'nuevo', alm:whSel, tipo:'Zona', padre:null, uso:'almacenaje', cod:'', nombre:'', err:{}});
  const delAlm = UBICACIONES.filter(u=>u.alm===whSel);
  const visibles = delAlm.filter(u=>verInactivas || u.activo);
  const coin = visibles.filter(u=>(u.cod+u.nombre).toLowerCase().includes(q.toLowerCase()) && (!usoFil || usoDe(u)===usoFil));
  const keep = new Set(coin.map(u=>u.id));
  coin.forEach(u=>{ let p=u.padre; while(p){ keep.add(p); p=UBICACIONES.find(x=>x.id===p).padre; } });
  const f = (q||usoFil) ? visibles.filter(u=>keep.has(u.id)) : visibles;
  const nInact = delAlm.filter(u=>!u.activo).length;
  const rows = f.map(u=>`
    <div class="dx-ui-row dx-ubi-cols ${u.activo?'':'is-off'}" role="button" tabindex="0" data-ubi="${u.id}" aria-label="Abrir ${u.nombre}">
      <div class="dx-ubi-name" style="--n:${nivelDe(u)}"><span class="dx-ui-icon ${u.general?'is-violet':'is-cyan'} dx-ubi-ind">${ICON_PIN}</span><em>${u.nombre}</em><small>${u.cod}</small></div>
      <span>${u.general?'<span class="dx-ui-pill is-gray"><i></i>General</span>':u.activo?'<span class="dx-ui-pill is-cyan"><i></i>'+u.tipo+'</span>':'<span class="dx-ui-pill is-gray"><i></i>Inactiva</span>'}${u.activo?pillUso(u):''}</span>
      <span class="dx-ubi-num">${u.items.toLocaleString('es-PE')}</span>
      <span class="dx-ubi-num">${u.und.toLocaleString('es-PE')} <small style="color:var(--dx-ui-gray);font:12px 'DM Sans',system-ui,sans-serif">und</small></span>
      <span class="dx-ubi-mob"><span class="dx-ubi-num">${u.und.toLocaleString('es-PE')} und</span><small>${u.items.toLocaleString('es-PE')} materiales</small></span>
      ${ICON_ARROW}
    </div>`).join('');
  $('#view').innerHTML=`
    ${toast?`<div class="dx-ubi-toast" role="status">${toast}</div>`:''}
    <div class="dx-ui-summary">
      <div class="dx-ui-chip"><b>${delAlm.filter(u=>u.activo).length}</b><span>Ubicaciones</span></div>
      <div class="dx-ui-chip"><b>${delAlm.reduce((s,u)=>s+(!u.padre?u.items:0),0)}</b><span>Materiales almacenados</span></div>
      <div class="dx-ui-chip"><b>${delAlm.filter(u=>u.general)[0].items}</b><span>Sin ubicar (en General)</span></div>
    </div>
    <div class="dx-ui-card">
      <div class="dx-ui-toolbar"><h2>Mapa del almacén</h2><span class="dx-ui-count">${f.length} resultado(s)</span>
        <select class="dx-rec-field dx-ubi-usofil" id="usofil" aria-label="Filtrar por uso"><option value="">Todos los usos</option>${Object.keys(USOS).map(k=>`<option value="${k}" ${usoFil===k?'selected':''}>${USOS[k]}</option>`).join('')}</select>
        <button class="dx-ubi-switch ${verInactivas?'on':''}" id="inact" role="switch" aria-checked="${verInactivas}" ${nInact?'':'disabled'}>Mostrar inactivas${nInact?' ('+nInact+')':''}</button>
        <label class="dx-ui-search">${ICON_SEARCH}<input id="q" value="${q}" placeholder="Buscar ubicación" aria-label="Buscar ubicación"></label></div>
      <div class="dx-ubi-wh" role="tablist">${ALMACENES.map(a=>`<button class="dx-ui-tab ${a.id===whSel?'on':''}" role="tab" aria-selected="${a.id===whSel}" data-wh="${a.id}">${a.nombre}</button>`).join('')}</div>
      <div class="dx-ui-head dx-ubi-cols" aria-hidden="true"><span>Ubicación</span><span>Tipo</span><span>Materiales</span><span>Unidades</span><span></span></div>
      ${rows || '<div class="dx-ui-empty">Sin coincidencias para tu búsqueda.</div>'}
    </div>`;
  toast='';
  document.querySelectorAll('[data-wh]').forEach(b=>b.onclick=()=>{whSel=b.dataset.wh;renderUbi();});
  $('#usofil').onchange=e=>{usoFil=e.target.value;renderUbi();};
  $('#inact').onclick=()=>{verInactivas=!verInactivas;renderUbi();};
  document.querySelectorAll('[data-ubi]').forEach(r=>{
    const open=()=>{ubiSel=r.dataset.ubi; render();};
    r.addEventListener('click',open);
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
  const inp=$('#q'); inp.addEventListener('input',e=>{q=e.target.value; const p=e.target.selectionStart; renderUbi(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p);});
}

function renderUbiDetalle(){
  const u = UBICACIONES.find(x=>x.id===ubiSel);
  const padre = u.padre ? UBICACIONES.find(x=>x.id===u.padre) : null;
  const alm = ALMACENES.find(a=>a.id===u.alm).nombre;
  const hijos = UBICACIONES.filter(x=>x.padre===u.id);
  const motivo = u.activo ? motivoNoDesactivar(u) : '';
  $('#pageTitle').textContent=u.nombre;
  $('#pageSub').textContent=alm+' · '+u.cod;
  $('#pageActions').innerHTML=
    (u.general?'':'<button class="dx-btn" id="editar">Editar</button>')+
    (u.general?'':(u.activo
      ?`<button class="dx-btn danger" id="desact" ${motivo?'disabled aria-describedby="why"':''}>Desactivar</button>`
      :'<button class="dx-btn primary" id="react">Reactivar</button>'));
  const stockRows = u.stock.map(l=>`
    <div class="dx-ui-row dx-ubi-det-cols">
      <span class="dx-rec-main"><b>${l.mat}</b><small>${l.cod}</small></span>
      <span style="color:var(--dx-ui-gray)">${l.lote}</span>
      <span class="dx-ubi-num" style="text-align:right">${l.fis.toLocaleString('es-PE')}</span>
    </div>`).join('');
  const hijosHtml = hijos.length ? `
    <div class="dx-ubi-subhead">Contiene ${hijos.length} sub-ubicación(es)</div>
    ${hijos.map(h=>`<div class="dx-ui-row dx-ubi-sub" role="button" tabindex="0" data-ubi="${h.id}" aria-label="Abrir ${h.nombre}"><span class="dx-ubi-name"><span class="dx-ui-icon is-cyan dx-ubi-ind">${ICON_PIN}</span><em>${h.nombre}</em><small>${h.cod}</small></span>${h.activo?'':'<span class="dx-ui-pill is-gray"><i></i>Inactiva</span>'}${ICON_ARROW}</div>`).join('')}` : '';
  $('#view').innerHTML=`
    <button class="dx-rec-back" id="back">← Volver a ubicaciones</button>
    <div class="dx-ui-card">
      <div class="dx-ui-toolbar"><h2>${u.cod} · ${u.nombre}</h2>
        ${u.general?'<span class="dx-ui-pill is-gray"><i></i>General</span>':''}${pillUso(u)}
        ${u.activo?'<span class="dx-ui-pill is-green"><i></i>Activa</span>':'<span class="dx-ui-pill is-gray"><i></i>Inactiva</span>'}</div>
      <div class="dx-rec-meta">
        <div><small>Tipo</small><span>${u.tipo}</span></div>
        <div><small>Ubicada en</small><span>${padre?padre.nombre:alm}</span></div>
        <div><small>Materiales (total)</small><span>${u.items.toLocaleString('es-PE')}</span></div>
        <div><small>Unidades (total)</small><span>${u.und.toLocaleString('es-PE')}</span></div>
      </div>
      ${(motivo || u.general) ? `<div class="dx-rec-note" id="why">${u.general?'La ubicación general existe en todos los almacenes: recibe el stock sin ubicar. No se edita ni se desactiva.':motivo}</div>`:''}
      ${!u.activo?'<div class="dx-rec-note">Inactiva: no aparece al elegir destino en Recepciones. Reactívala para volver a usarla.</div>':''}
      <div class="dx-ubi-subhead">Stock almacenado directamente aquí</div>
      ${u.stock.length?`<div class="dx-ui-head dx-ubi-det-cols" aria-hidden="true"><span>Material</span><span>Lote</span><span style="text-align:right">Físico</span></div>${stockRows}`
        :'<div class="dx-ui-empty">Esta ubicación no guarda stock directamente.</div>'}
      ${hijosHtml}
    </div>`;
  $('#back').onclick=()=>{ubiSel=null;render();};
  document.querySelectorAll('[data-ubi]').forEach(r=>{
    const open=()=>{ubiSel=r.dataset.ubi; render();};
    r.addEventListener('click',open);
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
  const ed=$('#editar'); if(ed) ed.onclick=()=>abrirPanel({modo:'editar', id:u.id, alm:u.alm, tipo:u.tipo, padre:u.padre, uso:usoDe(u), cod:u.cod, nombre:u.nombre, err:{}});
  const de=$('#desact'); if(de && !motivo) de.onclick=()=>{confirmDes=u.id; renderConfirm();};
  const re=$('#react'); if(re) re.onclick=()=>{u.activo=true; toast='«'+u.nombre+'» se reactivó.'; renderUbiDetalle();};
}

/* Panel lateral: alta y edición */
function opcionesPadre(p){
  const opt = x=>`<option value="${x.id}" ${x.id===p.padre?'selected':''}>${x.cod} · ${x.nombre}</option>`;
  const del = t=>UBICACIONES.filter(x=>x.alm===p.alm && x.tipo===t && x.activo);
  if(p.tipo==='Posición') return `<optgroup label="Racks">${del('Rack').map(opt).join('')}</optgroup><optgroup label="Zonas (posición sin rack)">${del('Zona').map(opt).join('')}</optgroup>`;
  return del('Zona').map(opt).join('');
}
function abrirPanel(p){ panel=p; renderPanel(); setTimeout(()=>{const f=document.querySelector('#pnl [autofocus],#pnl input,#pnl select'); if(f) f.focus();},0); }
function cerrarPanel(){ panel=null; const h=document.getElementById('pnlHost'); if(h) h.remove(); }
function validarPanel(p){
  const err={};
  if(p.modo==='nuevo' && p.tipo!=='Zona' && !p.padre) err.padre = p.tipo==='Posición'?'Elige el rack o la zona donde está la posición.':'Elige la zona a la que pertenece el '+p.tipo.toLowerCase()+'.';
  if(!p.cod.trim()) err.cod='El código es obligatorio.';
  else if(UBICACIONES.some(x=>x.alm===p.alm && x.id!==p.id && x.cod.toLowerCase()===p.cod.trim().toLowerCase())) err.cod='Ya existe una ubicación con ese código en este almacén.';
  if(!p.nombre.trim()) err.nombre='El nombre es obligatorio.';
  return err;
}
function renderPanel(){
  const p=panel; if(!p) return;
  let h=document.getElementById('pnlHost'); if(!h){ h=document.createElement('div'); h.id='pnlHost'; h.className='dx-ui dx-almacen'; document.getElementById('root').appendChild(h); }
  const almNom=ALMACENES.find(a=>a.id===p.alm).nombre;
  const nuevo=p.modo==='nuevo';
  const padreObj=p.padre?UBICACIONES.find(x=>x.id===p.padre):null;
  const ruta=[almNom].concat(padreObj?[padreObj.nombre]:[],[p.nombre||'…']).join(' › ');
  h.innerHTML=`<div class="dx-ubi-overlay" id="ov"></div>
  <aside class="dx-ubi-panel" id="pnl" role="dialog" aria-modal="true" aria-labelledby="pnlT">
    <header><h2 id="pnlT">${nuevo?'Nueva ubicación':'Editar ubicación'}</h2><button class="dx-ubi-x" id="pnlX" aria-label="Cerrar">×</button></header>
    <div class="dx-ubi-body">
      ${p.err.server?`<div class="dx-ubi-alert" role="alert">${p.err.server}</div>`:''}
      <div class="dx-ubi-f"><label>Almacén</label><div class="dx-ubi-ro">${almNom}</div></div>
      <div class="dx-ubi-f"><label id="lt">Tipo</label>
        ${nuevo?`<div class="dx-ubi-seg" role="radiogroup" aria-labelledby="lt">${['Zona','Rack','Posición','Piso'].map(t=>`<button type="button" role="radio" aria-checked="${p.tipo===t}" class="${p.tipo===t?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
        <small>Zona › rack › posición. Una posición también puede ir directo en una zona, y un piso es un área en el suelo dentro de una zona.</small>`
        :`<div class="dx-ubi-ro">${p.tipo}</div><small>El tipo y la ubicación padre no se cambian una vez creada.</small>`}</div>
      ${nuevo&&p.tipo!=='Zona'?`<div class="dx-ubi-f"><label for="fp">${p.tipo==='Posición'?'Rack o zona donde está':'Zona a la que pertenece'}</label>
        <select id="fp" class="dx-rec-field ${p.err.padre?'is-bad':''}"><option value="">Selecciona…</option>${opcionesPadre(p)}</select>
        ${p.err.padre?`<small class="bad">${p.err.padre}</small>`:''}</div>`
        :(!nuevo&&padreObj?`<div class="dx-ubi-f"><label>Ubicada en</label><div class="dx-ubi-ro">${padreObj.nombre}</div></div>`:'')}
      <div class="dx-ubi-f"><label for="fu">Uso</label>
        <select id="fu" class="dx-rec-field">${Object.keys(USOS).map(k=>`<option value="${k}" ${p.uso===k?'selected':''}>${USOS[k]}</option>`).join('')}</select>
        <small>Ayuda a ordenar y filtrar el mapa. Por ahora no cambia la disponibilidad del stock.</small></div>
      <div class="dx-ubi-f"><label for="fc">Código</label>
        <input id="fc" class="dx-rec-field ${p.err.cod?'is-bad':''}" value="${p.cod}" maxlength="30" placeholder="Ej. Z-A-R03" aria-describedby="fcH">
        <small id="fcH" class="${p.err.cod?'bad':''}">${p.err.cod||'Único dentro del almacén. Es lo que se ve en etiquetas y reportes.'}</small></div>
      <div class="dx-ubi-f"><label for="fn">Nombre</label>
        <input id="fn" class="dx-rec-field ${p.err.nombre?'is-bad':''}" value="${p.nombre}" maxlength="80" placeholder="Ej. Rack 03">
        ${p.err.nombre?`<small class="bad">${p.err.nombre}</small>`:''}</div>
      ${nuevo?`<div class="dx-ubi-path"><small>Se creará en</small><span>${ruta}</span></div>`:''}
    </div>
    <footer><button class="dx-btn" id="pnlC">Cancelar</button><button class="dx-btn primary" id="pnlS">${nuevo?'Crear ubicación':'Guardar cambios'}</button></footer>
  </aside>`;
  const sync=()=>{ const g=id=>document.getElementById(id); if(g('fc')) p.cod=g('fc').value; if(g('fn')) p.nombre=g('fn').value; if(g('fp')) p.padre=g('fp').value||null; if(g('fu')) p.uso=g('fu').value; };
  const keep=id=>{ const n=document.getElementById(id); if(n){ n.focus(); const l=n.value.length; if(n.setSelectionRange) n.setSelectionRange(l,l);} };
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sync(); p.tipo=b.dataset.t; p.padre=null; p.err={}; renderPanel();});
  ['fc','fn'].forEach(id=>{const n=document.getElementById(id); if(n) n.addEventListener('input',()=>{sync(); const pv=document.querySelector('.dx-ubi-path span'); if(pv){const po=p.padre?UBICACIONES.find(x=>x.id===p.padre):null; pv.textContent=[almNom].concat(po?[po.nombre]:[],[p.nombre||'…']).join(' › ');}});});
  const fp=document.getElementById('fp'); if(fp) fp.onchange=()=>{sync(); renderPanel();};
  document.getElementById('pnlX').onclick=cerrarPanel; document.getElementById('pnlC').onclick=cerrarPanel; document.getElementById('ov').onclick=cerrarPanel;
  document.getElementById('pnl').addEventListener('keydown',e=>{if(e.key==='Escape') cerrarPanel();});
  document.getElementById('pnlS').onclick=()=>{
    sync(); p.err=validarPanel(p);
    if(Object.keys(p.err).length){ renderPanel(); const first=p.err.padre?'fp':p.err.cod?'fc':'fn'; keep(first); return; }
    if(nuevo){ const id='u'+(UBICACIONES.length+1); UBICACIONES.push({id, cod:p.cod.trim(), nombre:p.nombre.trim(), alm:p.alm, padre:p.padre, tipo:p.tipo, uso:p.uso, items:0, und:0, activo:true, stock:[]}); toast='Se creó «'+p.nombre.trim()+'» (sin stock todavía).'; }
    else { const u=UBICACIONES.find(x=>x.id===p.id); u.cod=p.cod.trim(); u.nombre=p.nombre.trim(); u.uso=p.uso; toast='Cambios guardados.'; }
    cerrarPanel(); render();
  };
}
function renderConfirm(){
  const u=UBICACIONES.find(x=>x.id===confirmDes); if(!u) return;
  let h=document.getElementById('cfHost'); if(!h){ h=document.createElement('div'); h.id='cfHost'; h.className='dx-ui dx-almacen'; document.getElementById('root').appendChild(h); }
  h.innerHTML=`<div class="dx-ubi-overlay" id="cfOv"></div>
  <div class="dx-ubi-confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfD">
    <h2 id="cfT">¿Desactivar «${u.nombre}»?</h2>
    <p id="cfD">Dejará de aparecer como destino en Recepciones. El historial y el kardex no cambian, y podrás reactivarla cuando quieras.</p>
    <div class="dx-ubi-confirm-f"><button class="dx-btn" id="cfN">Cancelar</button><button class="dx-btn danger" id="cfY">Desactivar</button></div>
  </div>`;
  const close=()=>{confirmDes=null; h.remove();};
  document.getElementById('cfN').onclick=close; document.getElementById('cfOv').onclick=close;
  document.getElementById('cfY').onclick=()=>{u.activo=false; toast='«'+u.nombre+'» se desactivó.'; close(); renderUbiDetalle();};
  document.getElementById('cfN').focus();
  h.addEventListener('keydown',e=>{if(e.key==='Escape') close();});
}

document.querySelectorAll('.dx-ui-tabs .dx-ui-tab').forEach(t=>t.addEventListener('click',()=>{view=t.dataset.view; ocSel=null; ubiSel=null; q=''; render();}));
$('#themeBtn').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
  $('#themeBtn').textContent = d?'Modo oscuro':'Modo claro';
};
render();
</script>
</body>
</html>
