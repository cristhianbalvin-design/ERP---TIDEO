# Despliega la Edge Function de Aria (asistente-erp) en Supabase (proyecto "ERP - Tideo") cada vez que su
# código cambia en main. Nadie la despliega a mano: primero corren las pruebas de Deno y, solo si pasan,
# se publica el código tal como quedó en el commit. Requiere el secreto SUPABASE_ACCESS_TOKEN.
name: Desplegar Aria (Edge asistente-erp)

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/asistente-erp/**
      - supabase/functions/_shared/**
      - .github/workflows/desplegar-aria.yml
  workflow_dispatch:

concurrency:
  group: desplegar-aria
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pruebas de la Edge (Deno)
        working-directory: supabase/functions/asistente-erp
        run: deno test --allow-env
      - name: Token configurado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Desplegar asistente-erp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy asistente-erp --project-ref atqwyjfidfoepthygfoo
